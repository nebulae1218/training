<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs><linearGradient id="brandBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04c6ee"/><stop offset="1" stop-color="#175ef5"/></linearGradient></defs><g transform="translate(80.00,163.00) scale(2.059524)"><defs>
<linearGradient id="outer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10d7cb"/><stop offset=".38" stop-color="#08aeea"/><stop offset="1" stop-color="#2251e7"/></linearGradient>
<linearGradient id="shell" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f9ffff"/><stop offset=".56" stop-color="#ffffff"/><stop offset="1" stop-color="#a0b9f5"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#067aab"/><stop offset=".45" stop-color="#034c89"/><stop offset="1" stop-color="#0b134c"/></linearGradient>
