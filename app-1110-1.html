<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI陪练 · 学员端 · 登录</title>
<style>
:root{
  --primary:#1B5BF0; --primary-d:#1248C8; --primary-2:#2E6BFF; --p-bg:#EBF1FF;
  --cyan:#04C6EE; --grad:linear-gradient(135deg,#04C6EE,#175EF5);
  --bg:#F3F5FA; --surface:#FFF; --bd:#E8ECF4; --bd2:#D9DFEB;
  --t1:#1A2233; --t2:#5B6478; --t3:#939BAD;
  --ok:#12A760; --ok-bg:#E6F7EF; --bad:#E0453F; --bad-bg:#FDECEB; --warn:#E8960C; --warn-bg:#FFF5E3;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --r-s:12px; --r-m:14px; --r-l:18px;
  --sh-btn:0 10px 22px rgba(46,107,255,.30);
  --sh-btn-h:0 12px 26px rgba(46,107,255,.36);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(160deg,#E9EEF8,#DDE6F5);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}

/* ===== 手机壳 ===== */
.phone{width:390px;height:844px;background:#fff;border-radius:44px;box-shadow:0 30px 80px rgba(20,31,74,.35),0 0 0 10px #10173A,0 0 0 12px #2A3563;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#0B1020;border-radius:14px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:#1A2233;z-index:62;pointer-events:none}
.sb-r{display:flex;align-items:center;gap:5px}
.appbody{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:44px;background:#fff}

/* ===== 步骤容器 ===== */
.step{display:none}
.step.on{display:flex;flex-direction:column;flex:1;overflow:hidden;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 顶部插画区（参考截图布局：浅色渐变 + 悬浮 3D 主题插画） ===== */
.hero{position:relative;height:236px;flex-shrink:0;background:linear-gradient(180deg,#D9E9FF 0%,#EAF3FF 55%,#F7FAFF 100%);overflow:hidden}
.hero svg{position:absolute;right:6px;top:6px}
.hero .glow{position:absolute;left:-40px;top:30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%)}

/* ===== 欢迎语 ===== */
.welcome{padding:6px 26px 0;flex-shrink:0}
.welcome h1{font-size:27px;font-weight:800;letter-spacing:.5px;color:#12182B}
.welcome .wsub{margin-top:9px;font-size:13px;color:#7A8399;line-height:1.6}

/* ===== 表单区 ===== */
.page{flex:1;overflow-y:auto;padding:0 26px 20px;display:flex;flex-direction:column}
.page>*{flex-shrink:0}
.page.grow{justify-content:flex-start}
.page.center{justify-content:center}

/* 步骤页顶部标题（选租户/改密/完成） */
.st-head{flex-shrink:0;padding:26px 26px 0}
.st-head h1{font-size:23px;font-weight:800;color:#12182B}
.st-head .wsub{margin-top:8px;font-size:13px;color:#7A8399}
.back-a{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--primary);font-weight:550;margin-bottom:12px}

/* 胶囊输入框（参考截图：浅灰蓝底、无边框、全圆角） */
.field{margin-bottom:16px}
.pill{display:flex;align-items:center;height:54px;border-radius:27px;background:#EDF2FA;border:1.5px solid transparent;padding:0 20px;transition:.15s}
.pill:focus-within{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px var(--p-bg)}
.pill svg{width:19px;height:19px;color:#8B94A9;flex-shrink:0}
.pill input{flex:1;border:none;outline:none;font-size:15px;color:var(--t1);background:transparent;padding:0 12px;height:100%}
.pill input::placeholder{color:#A6AFC1}
.pill .eye{color:#8B94A9;cursor:pointer;padding:4px;display:flex}

/* 协议勾选（参考截图：圆形勾选 + 蓝色协议链接） */
.agree{display:flex;align-items:flex-start;gap:9px;margin:4px 2px 22px;font-size:12.5px;color:#7A8399;line-height:1.7;cursor:pointer;user-select:none}
.agree input{appearance:none;-webkit-appearance:none;flex-shrink:0;width:18px;height:18px;margin-top:2px;border:1.5px solid #C3CDDD;border-radius:50%;position:relative;cursor:pointer;transition:.15s;background:#fff}
.agree input:checked{border-color:transparent;background:var(--grad)}
.agree input:checked::after{content:"";position:absolute;left:5.5px;top:2.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.agree .lk{color:var(--primary);font-weight:550}

/* 主按钮（参考截图：大胶囊 + 浅蓝渐变） */
.btn-p{width:100%;height:54px;border-radius:27px;background:linear-gradient(135deg,#6FA9F7,#2E6BFF);color:#fff;font-size:16.5px;font-weight:650;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--sh-btn);transition:.15s}
.btn-p:active{background:linear-gradient(135deg,#5C97F2,#1B5BF0);box-shadow:var(--sh-btn-h);transform:scale(.985)}
.btn-p.dim{opacity:.45;pointer-events:none}
.link-row{text-align:center;margin-top:16px}
.link-row .lk{color:#7A8399;font-size:13px}

/* 错误提示 */
.err{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--bad);background:var(--bad-bg);border:1px solid #F6D2D0;border-radius:22px;padding:10px 16px;margin-bottom:16px}
.err.on{display:flex}
.err svg{width:15px;height:15px;flex-shrink:0}

/* 租户选择 */
.tenant{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid #E4EAF4;border-radius:18px;margin-bottom:12px;cursor:pointer;transition:.15s;background:#fff;box-shadow:0 2px 10px rgba(20,31,74,.05)}
.tenant:active{border-color:var(--primary);background:var(--p-bg)}
.tenant .av{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.tenant .tt b{display:block;font-size:14.5px}
.tenant .tt span{font-size:11.5px;color:var(--t3)}
.tenant .go{margin-left:auto;color:var(--t3)}
.tenant.disabled{opacity:.55;cursor:not-allowed;background:#F4F6FA;box-shadow:none}
.tenant.disabled:active{border-color:#E4EAF4;background:#F4F6FA}

/* 改密码提示 */
.pwd-tip{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid #F6E2BF;border-radius:14px;padding:11px 14px;margin-bottom:18px;line-height:1.6;display:flex;gap:7px;align-items:flex-start}
.pwd-tip svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}

/* 忘记密码底部弹层（app 原生交互） */
.sheet-mask{position:absolute;inset:0;background:rgba(12,18,40,.40);display:none;z-index:80;align-items:flex-end}
.sheet-mask.on{display:flex;animation:fade .2s ease}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px 22px 26px;animation:slide .25s ease}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:#D9DFEB;margin:0 auto 16px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:6px}
.sheet .ms{font-size:12.5px;color:var(--t3);margin-bottom:18px;line-height:1.6}
.sheet .modal-actions{display:flex;gap:10px;margin-top:6px}
.btn-g{height:54px;border-radius:27px;background:#EDF2FA;color:var(--t2);font-size:15.5px;font-weight:600;flex:1}
.btn-g:active{color:var(--primary)}
.code-row{display:flex;gap:10px}
.code-row .pill{flex:1}
.code-btn{height:54px;flex-shrink:0;padding:0 16px;border:none;color:var(--primary);border-radius:27px;font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--p-bg)}
.code-btn:disabled{color:var(--t3);background:#F0F2F7}

.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:rgba(20,31,74,.94);color:#fff;font-size:13px;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;z-index:120;display:flex;align-items:center;gap:7px;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:15px;height:15px;color:#5FE0C8}
.homebar{flex-shrink:0;height:22px;display:flex;align-items:center;justify-content:center;background:transparent}
.homebar i{width:130px;height:5px;border-radius:99px;background:#12182B;opacity:.9}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><div class="sb-r"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M2 17h2v-5H2v5zm4 0h2V7H6v10zm4 0h2v-8h-2v8zm4 0h2V4h-2v13zm4 0h2v-3h-2v3z"/></svg><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 10l9 7 9-7c-1.5-1.6-4-3-9-3s-7.5 1.4-9 3z"/></svg><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="3" y="8" width="16" height="9" rx="2"/><rect x="20" y="11" width="2" height="3" rx="1"/></svg></div></div>

  <div class="appbody" id="appbody">

    <!-- 步骤1：登录（参考截图布局） -->
    <section class="step on" id="stepLogin">
      <div class="hero">
        <div class="glow"></div>
        <svg width="330" height="224" viewBox="0 0 330 224" fill="none">
          <!-- 悬浮底座 -->
          <ellipse cx="212" cy="196" rx="96" ry="20" fill="#D6E5FB"/>
          <ellipse cx="212" cy="190" rx="70" ry="14" fill="#fff"/>
          <ellipse cx="212" cy="186" rx="52" ry="10" fill="#E8F0FE"/>
          <!-- 主对话气泡（AI 教练） -->
          <g filter="url(#soft)">
            <rect x="140" y="58" width="132" height="88" rx="26" fill="#fff"/>
            <rect x="140" y="58" width="132" height="88" rx="26" fill="url(#g1)" opacity=".08"/>
            <path d="M168 146l14 18 4-18z" fill="#fff"/>
            <circle cx="176" cy="94" r="5" fill="#2E6BFF"/>
            <circle cx="200" cy="94" r="5" fill="#6FA9F7"/>
            <circle cx="224" cy="94" r="5" fill="#B9D4FB"/>
            <rect x="166" y="112" width="80" height="7" rx="3.5" fill="#E3ECFB"/>
            <rect x="166" y="124" width="56" height="7" rx="3.5" fill="#EDF2FB"/>
          </g>
          <!-- 麦克风徽章（陪练语音） -->
          <g>
            <circle cx="138" cy="70" r="26" fill="url(#g1)"/>
            <rect x="133" y="56" width="10" height="18" rx="5" fill="#fff"/>
            <path d="M127 68a11 11 0 0 0 22 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M138 79v6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- 评分徽章 -->
          <g>
            <rect x="252" y="128" width="72" height="34" rx="17" fill="#fff"/>
            <path d="M268 136l2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-3-5.4 3 1.1-6-4.5-4.3 6.1-.8z" fill="#FFB53D"/>
            <rect x="282" y="142" width="32" height="6" rx="3" fill="#E3ECFB"/>
          </g>
          <!-- 星光点缀 -->
          <path d="M108 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#9CC2F9"/>
          <path d="M296 46l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#C7DBFA"/>
          <circle cx="120" cy="120" r="4" fill="#DCE9FB"/>
          <defs>
            <linearGradient id="g1" x1="112" y1="30" x2="272" y2="160" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4E9BF5"/><stop offset="1" stop-color="#1B5BF0"/>
            </linearGradient>
            <filter id="soft" x="120" y="40" width="180" height="150" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B5BF0" flood-opacity=".12"/>
            </filter>
          </defs>
        </svg>
      </div>

      <div class="welcome">
        <h1>Hi ~ 欢迎登录</h1>
        <p class="wsub">AI陪练 · 学员端｜请使用管理员为您开通的账号登录</p>
      </div>

      <div class="page grow" style="padding-top:26px">
        <div class="err" id="loginErr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="loginErrTx"></span></div>
        <div class="field"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="username"></div></div>
        <div class="field"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pwd" type="password" placeholder="请输入登录密码" autocomplete="current-password"><span class="eye" id="eye" onclick="toggleEye()" title="显示/隐藏密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span></div></div>

        <label class="agree"><input type="checkbox" id="agree"><span>我已阅读并同意<span class="lk">《用户协议》</span>及<span class="lk">《隐私政策》</span></span></label>

        <button class="btn-p" onclick="doLogin()">登 录</button>
        <div class="link-row"><span class="lk" onclick="openForgot()">遇到问题？重置密码</span></div>
      </div>
    </section>

    <!-- 步骤2：选择租户 -->
    <section class="step" id="stepTenant">
      <div class="st-head">
        <span class="back-a" onclick="goStep('login')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M15 18l-6-6 6-6"/></svg>返回登录</span>
        <h1>选择要进入的企业</h1>
        <p class="wsub">该账号关联多个企业，请选择本次进入的租户</p>
      </div>
      <div class="page grow" style="padding-top:20px">
        <div id="tenantList"></div>
      </div>
    </section>

    <!-- 步骤3：首次登录设置密码 -->
    <section class="step" id="stepSetpwd">
      <div class="st-head">
        <span class="back-a" onclick="goStep('login')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M15 18l-6-6 6-6"/></svg>返回登录</span>
        <h1>设置登录密码</h1>
        <p class="wsub">首次登录请设置新密码，设置后请妥善保管</p>
      </div>
      <div class="page grow" style="padding-top:20px">
        <div class="pwd-tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>初始密码不可长期使用。新密码需 8 位以上，且同时包含字母与数字。</span></div>
        <div class="err" id="setErr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="setErrTx"></span></div>
        <div class="field"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="np1" type="password" placeholder="新密码（8 位以上，含字母和数字）"></div></div>
        <div class="field"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="np2" type="password" placeholder="请再次输入新密码"></div></div>
        <button class="btn-p" onclick="doSetPwd()">确认并设置</button>
      </div>
    </section>

    <!-- 忘记密码底部弹层（app 原生交互） -->
    <div class="sheet-mask" id="forgotMask">
      <div class="sheet">
        <div class="grab"></div>
        <h3>重置登录密码</h3>
        <p class="ms">账号由后台开通，重置需验证手机号。我们将向该手机号发送短信验证码（原型演示中验证码任意 6 位即可）。</p>
        <div class="err" id="fgErr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="fgErrTx"></span></div>
        <div class="field"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><input id="fgPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入开通账号的手机号"></div></div>
        <div class="field"><div class="code-row"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M4 8l8 5 8-5"/></svg><input id="fgCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码"></div><button class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button></div></div>
        <div class="field"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="fgPwd" type="password" placeholder="新密码（8 位以上，含字母和数字）"></div></div>
        <div class="field" style="margin-bottom:0"><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="fgPwd2" type="password" placeholder="请再次输入新密码"></div></div>
        <div class="modal-actions">
          <button class="btn-g" onclick="closeForgot()">取消</button>
          <button class="btn-p" style="flex:1" onclick="doReset()">重置密码</button>
        </div>
      </div>
    </div>

  </div>
  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg><span id="toastTx"></span></div>
  <div class="homebar"><i></i></div>
</div>

<script>
/* ===== 演示数据（生产环境由后台开通并下发初始密码）=====
   V1.1 模型：locked=全局锁定(所有租户不可登录)；firstLogin=初始密码须改密；
   tenants[].member=当前租户成员状态(停用则禁止进入该租户) */
const ACCOUNTS = {
  '13800001000': {name:'系统管理员', pwd:'Admin@123', locked:false, firstLogin:false,
    tenants:[{name:'长久集团', sub:'学员端', member:'启用', role:'集团管理员'}]},
  '13800006621': {name:'赵磊', pwd:'ChangPwd@123', locked:false, firstLogin:true,
    tenants:[{name:'长久集团', sub:'学员端', member:'启用', role:'门店培训管理员'}]},
  '13800002000': {name:'钱多多', pwd:'Test@123', locked:false, firstLogin:false,
    tenants:[{name:'长久集团', sub:'学员端', member:'启用', role:'销售顾问'},
             {name:'西南区域', sub:'学员端', member:'启用', role:'销售顾问'},
             {name:'华南区域', sub:'学员端', member:'停用', role:'销售顾问'}]},
  '13800003000': {name:'李文静', pwd:'Lock@123', locked:true, firstLogin:false,
    tenants:[{name:'石家庄裕华店', sub:'学员端', member:'启用', role:'销售顾问'}]}
};
const ATTEMPT_LIMIT = 5;
let attempts = {};
let cur = null;
let curTenant = null;

function $(id){return document.getElementById(id);}
function goStep(s){
  ['login','tenant','setpwd'].forEach(k=>{
    const el=$('step'+k.charAt(0).toUpperCase()+k.slice(1));
    el.classList.toggle('on', k===s);
  });
}
function toast(msg){
  $('toastTx').textContent = msg;
  const t=$('toast'); t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200);
}
function showErr(box, tx){ $(box+'Tx').textContent = tx; $(box).classList.add('on'); }
function clearErr(box){ $(box).classList.remove('on'); }
function toggleEye(){ const i=$('pwd'); i.type = i.type==='password'?'text':'password'; }
function validPwd(p){ return p.length>=8 && /[A-Za-z]/.test(p) && /\d/.test(p); }

/* 步骤1：登录 */
function doLogin(){
  clearErr('loginErr');
  if(!$('agree').checked){ showErr('loginErr','请先阅读并同意《用户协议》和《隐私政策》'); return; }
  const phone=$('phone').value.trim();
  const pwd=$('pwd').value;
  if(!/^1\d{10}$/.test(phone)){ showErr('loginErr','请输入正确的 11 位手机号'); return; }
  if(!pwd){ showErr('loginErr','请输入登录密码'); return; }
  const acct=ACCOUNTS[phone];
  if(!acct){ showErr('loginErr','该手机号尚未开通账号，请联系企业管理员在后台开通'); return; }
  if(acct.locked){ showErr('loginErr','该账号已被全局锁定，所有租户均无法登录，请联系管理员'); return; }
  if(acct.pwd!==pwd){
    attempts[phone]=(attempts[phone]||0)+1;
    const left=ATTEMPT_LIMIT-attempts[phone];
    if(left<=0){ showErr('loginErr','密码连续错误次数过多，账号已临时锁定，请稍后或联系管理员'); return; }
    showErr('loginErr','密码错误，还可尝试 '+left+' 次（达到 '+ATTEMPT_LIMIT+' 次将临时锁定）'); return;
  }
  cur={phone,acct};
  attempts[phone]=0;
  afterAuth();
}
function afterAuth(){
  const avail=cur.acct.tenants.filter(t=>t.member==='启用');
  if(cur.acct.firstLogin){ goStep('setpwd'); return; }
  if(avail.length>1){ renderTenants(avail); goStep('tenant'); return; }
  finish(avail[0]||null);
}
function renderTenants(avail){
  let h='';
  cur.acct.tenants.forEach((t,i)=>{
    const ok=t.member==='启用';
    h+='<div class="tenant'+(ok?'':' disabled')+'" '+(ok?'onclick="pickTenant('+i+')"':'')+'>'+
      '<div class="av">'+t.name.charAt(0)+'</div>'+
      '<div class="tt"><b>'+t.name+'</b><span>'+t.sub+' · '+t.role+'</span></div>'+
      (ok?'<div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 6l6 6-6 6"/></svg></div>'
         :'<span style="font-size:11px;color:#E0453F;background:#FDECEB;padding:2px 8px;border-radius:99px">成员已停用</span>')+
      '</div>';
  });
  $('tenantList').innerHTML=h;
}
function pickTenant(i){ const t=cur.acct.tenants[i]; if(t.member!=='启用') return; finish(t); }
function doSetPwd(){
  clearErr('setErr');
  const np=$('np1').value, cp=$('np2').value;
  if(!validPwd(np)){ showErr('setErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np!==cp){ showErr('setErr','两次输入的密码不一致'); return; }
  cur.acct.pwd=np; cur.acct.firstLogin=false;
  toast('密码设置成功'); afterAuth();
}
function finish(tenant){
  curTenant=tenant;
  enter();
}
function enter(){ try{ window.location.href='app-1104-1.html'; }catch(e){} }

/* 忘记密码（底部弹层） */
let codeTimer=null, codeSent=false;
function openForgot(){ $('forgotMask').classList.add('on'); clearErr('fgErr'); }
function closeForgot(){ $('forgotMask').classList.remove('on'); }
function sendCode(){
  const phone=$('fgPhone').value.trim();
  if(!/^1\d{10}$/.test(phone)){ showErr('fgErr','请输入正确的 11 位手机号'); return; }
  if(!ACCOUNTS[phone]){ showErr('fgErr','该手机号尚未开通账号，无法发送验证码'); return; }
  if(ACCOUNTS[phone].locked){ showErr('fgErr','该账号已被全局锁定，请联系管理员重置'); return; }
  codeSent=true;
  let s=60; const b=$('codeBtn'); b.disabled=true; b.textContent=s+'s 后重发';
  codeTimer=setTimeout(function tick(){ s--; if(s<=0){ b.disabled=false; b.textContent='重新获取'; clearTimeout(codeTimer);} else { b.textContent=s+'s 后重发'; codeTimer=setTimeout(tick,1000);} },1000);
  toast('验证码已发送（演示：任意 6 位）');
}
function doReset(){
  clearErr('fgErr');
  const phone=$('fgPhone').value.trim();
  const code=$('fgCode').value.trim();
  const np=$('fgPwd').value, cp=$('fgPwd2').value;
  if(!ACCOUNTS[phone]){ showErr('fgErr','该手机号尚未开通账号'); return; }
  if(!codeSent){ showErr('fgErr','请先获取短信验证码'); return; }
  if(!/^\d{6}$/.test(code)){ showErr('fgErr','请输入 6 位短信验证码'); return; }
  if(!validPwd(np)){ showErr('fgErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np!==cp){ showErr('fgErr','两次输入的密码不一致'); return; }
  ACCOUNTS[phone].pwd=np; ACCOUNTS[phone].firstLogin=false;
  closeForgot(); toast('密码重置成功，请使用新密码登录');
}

$('pwd').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
</script>
