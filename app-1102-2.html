<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI陪练 · 学员端 APP</title>
<style>
:root{
  --primary:#1B5BF0; --primary-d:#1248C8; --p-bg:#EBF1FF; --p-bd:#C4D6FF;
  --cyan:#04C6EE; --grad:linear-gradient(135deg,#04C6EE,#175EF5);
  --bg:#F3F5FA; --surface:#FFF; --bd:#E8ECF4; --bd2:#D9DFEB;
  --t1:#1A2233; --t2:#5B6478; --t3:#939BAD;
  --ok:#12A760; --ok-bg:#E6F7EF; --warn:#E8960C; --warn-bg:#FFF5E3; --bad:#E0453F; --bad-bg:#FDECEB;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(160deg,#E9EEF8,#DDE6F5);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:0}

.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 30px 80px rgba(20,31,74,.35),0 0 0 10px #10173A,0 0 0 12px #2A3563;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#0B1020;border-radius:14px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1);z-index:62;pointer-events:none}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-r svg{display:block}
.statusbar.light{color:#fff}
.statusbar.solid{background:#fff}

.appbody{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:44px}
.page{flex:1;overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column}
.page::-webkit-scrollbar{width:0}
.page>*{flex-shrink:0}
.page>.subhead{margin:0 -16px}
.page.bleed{margin-top:-44px}

/* tabbar */
.tabbar{flex-shrink:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding:7px 6px 20px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--t3)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--primary);font-weight:600}

/* 顶栏（二级页） */
.subhead{position:sticky;top:0;z-index:30;display:flex;align-items:center;padding:8px 12px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.subhead .bk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.subhead .bk:active{background:var(--bg)}
.subhead b{position:absolute;left:0;right:0;top:8px;line-height:34px;text-align:center;font-size:16.5px;font-weight:650;pointer-events:none}
.subhead .r{position:absolute;right:12px;top:8px;height:34px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--primary);font-weight:550}
.subhead .phb{width:30px;height:30px;border-radius:50%;background:var(--p-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.subhead .phb:active{background:#dbe6ff}
.subhead .phb.txtb{font-size:13px;font-weight:650;line-height:1}

/* 首页头部 */
.home-head{margin:0 -16px;padding:64px 16px 18px;background:radial-gradient(130% 110% at 88% -25%,rgba(255,255,255,.32),transparent 55%),var(--grad);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 10px 26px rgba(23,94,245,.22)}
.home-head .row{display:flex;align-items:center;gap:10px}
.home-head .row img{height:26px}
.home-head .hello{margin-top:14px;font-size:19px;font-weight:700}
.home-head .hello span{font-size:13px;font-weight:400;opacity:.85;display:block;margin-top:2px}
.bell{margin-left:auto;position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.bell i{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:#FF4D4F;border-radius:99px;font-size:9.5px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}

/* 卡片 */
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.sec-t{display:flex;align-items:center;margin:16px 0 9px}
.sec-t b{font-size:15px;font-weight:650}
.sec-t a{margin-left:auto;font-size:12px;color:var(--t3)}
.mt{margin-top:12px}

/* 任务页大标题 */
.pg-h1{font-size:22px;font-weight:750;color:var(--t1);margin:8px 0 10px;letter-spacing:.2px}

/* 任务卡（列表版，参考稿样式） */
.tk{background:var(--surface);border-radius:16px;padding:16px 15px 13px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,31,74,.06);transition:transform .12s}
.tk:active{transform:scale(.985)}
.tk-top{display:flex;align-items:flex-start;gap:10px}
.tk-name{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.4;color:var(--t1)}
.tk-badge{flex-shrink:0;font-size:11px;font-weight:550;line-height:1;padding:5px 10px;border-radius:99px;background:#E8F0FE;color:var(--primary);white-space:nowrap}
.tk-desc{margin:8px 0 0;font-size:12.5px;line-height:1.7;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk-bar{height:6px;border-radius:3px;background:#E9EEF7;margin-top:12px;overflow:hidden}
.tk-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2F6BFF,#4E8DFF)}
.tk-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.tk-dl{font-size:11.5px;color:var(--t3)}
.tk-pct{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--primary)}
.tk-pct svg{margin-top:.5px}
.task-hero{background:linear-gradient(120deg,#175EF5,#3E8BFF);border-radius:16px;padding:15px;color:#fff;box-shadow:0 8px 20px rgba(23,94,245,.3)}
.task-hero .tag{font-size:10.5px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:99px}
.task-hero b.t{display:block;font-size:15.5px;margin:7px 0 3px}
.task-hero p{font-size:11.5px;opacity:.85}
.prog{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:3px}

/* 快捷入口 */
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.q{background:var(--surface);border-radius:14px;padding:13px 4px;text-align:center;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.q .ic{width:40px;height:40px;margin:0 auto 7px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.q b{font-size:11.5px;font-weight:600;display:block}
.ic-b{background:var(--p-bg);color:var(--primary)}
.ic-g{background:#E6F7F0;color:#0DA678}
.ic-o{background:#FFF3E4;color:#F08A0C}
.ic-p{background:#F1EDFF;color:#6E4EEA}
.ic-c{background:#E0F6FB;color:#0AA3C6}

/* 通用条目 */
.item{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:14px;padding:13px 14px;box-shadow:0 1px 3px rgba(20,31,74,.05);margin-bottom:9px}
.item .thumb{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:650}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tt span{font-size:11.5px;color:var(--t3);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{color:var(--t3);flex-shrink:0}
.bar{height:5px;background:#EDEFF5;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.bar i.g{background:var(--ok)}.bar i.w{background:var(--warn)}.bar i.d{background:var(--bad)}
.st{display:inline-flex;align-items:center;padding:1.5px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}.st.info{background:var(--p-bg);color:var(--primary)}
.st.gray{background:#EEF0F5;color:var(--t3)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-size:14.5px;font-weight:600}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(27,91,240,.3)}
.btn-p:active{background:var(--primary-d)}
.btn-g{background:#fff;border:1px solid var(--bd2);color:var(--t2)}
.btn-dis{background:#E7EAF1;color:var(--t3);box-shadow:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.chips::-webkit-scrollbar{height:0}
.chips.tight{gap:6px;padding:0;margin:0}
.chips.tight + .chips.tight{margin:6px 0 9px}
.chips.tight .chip{padding:4px 11px;font-size:11.5px}
.chips.tight .chip.on{font-weight:600}
.chip{flex-shrink:0;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--bd);font-size:12.5px;color:var(--t2)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:9px 13px;margin-bottom:11px;color:var(--t3);font-size:13px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:none}

/* 剧本详情 */
.cover{margin:0 -16px;padding:20px 16px 18px;background:radial-gradient(130% 110% at 88% -25%,rgba(255,255,255,.32),transparent 55%),var(--grad);color:#fff}
.cover h1{font-size:19px;font-weight:700;margin-bottom:6px}
.cover p{font-size:12.5px;opacity:.88;line-height:1.6}
.pill{display:inline-block;font-size:11px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;margin-right:6px;margin-top:8px}
.persona-pick{display:flex;gap:9px}
.pp{flex:1;border:1.5px solid var(--bd);border-radius:13px;padding:11px;text-align:center;cursor:pointer}
.pp.on{border-color:var(--primary);background:#F6F9FF}
.pp .av{width:40px;height:40px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:650;font-size:15px}
.pp b{font-size:12.5px;display:block}
.pp span{font-size:10.5px;color:var(--t3)}
.pp-add{flex:1;border:1.5px dashed #C7D2E8;border-radius:13px;padding:11px;text-align:center;color:var(--primary);cursor:pointer;background:#F8FAFF}
.pp-add .av{width:40px;height:40px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;background:#E3EDFF;color:var(--primary)}
.pp-add b{font-size:12.5px;display:block}
.pp-add span{font-size:10.5px;color:var(--t3)}
/* 自定义客户表单 */
.f-lab{display:block;font-size:12px;color:var(--t2);font-weight:600;margin:13px 0 0}
.f-lab:first-child{margin-top:0}
.f-in{width:100%;border:1px solid var(--bd2);border-radius:11px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;margin-top:6px}
.f-in:focus{border-color:var(--primary)}
.f-cnt{font-size:10.5px;color:var(--t3);margin-top:4px}
.info-kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.info-kv:last-child{border:none}
.info-kv span{color:var(--t3)}
.info-kv b{font-weight:600}

/* 陪练执行 */
.chatpage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#EAF2FF 0%,#F3F5FA 30%)}
.chat-head{flex-shrink:0;background:#fff;border-bottom:1px solid var(--bd);padding:8px 16px 10px;display:flex;align-items:center;gap:9px}
.chat-head .end{margin-left:auto;color:var(--bad);font-size:13px;font-weight:600}
.timer{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;background:var(--bg);padding:3px 9px;border-radius:99px}
.chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;max-width:85%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.mav{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:650;overflow:hidden}
.mav.ai{background:#fff;box-shadow:0 2px 6px rgba(23,94,245,.18)}
.mav.ai img{width:100%;height:100%;object-fit:contain}
.mav.self{background:linear-gradient(135deg,#12A760,#3FC98A)}
.bub{background:#fff;border-radius:3px 14px 14px 14px;padding:10px 13px;font-size:13.5px;line-height:1.65;box-shadow:0 1px 3px rgba(20,31,74,.06)}
.msg.me .bub{background:var(--primary);color:#fff;border-radius:14px 3px 14px 14px}
/* 文字对话页：气泡操作条（推荐话术/评分/优化） */
.crow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ccb{font-size:11px;padding:3.5px 10px;border-radius:99px;background:#fff;border:1px solid var(--bd);color:var(--t2)}
.ccb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cextra{margin-top:6px;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.7;background:#F2F6FD;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.cextra b{display:block;margin-bottom:2px;font-size:11px;color:var(--primary)}
.cextra .mut{color:var(--t3)}
/* 剧本列表：头部 + 卡片 + toast */
.s-head{display:flex;gap:9px;align-items:center}
.search.s-short{flex:1;margin-bottom:0;padding:8px 12px}
.crt{flex-shrink:0;height:29px;padding:0 10px;border-radius:9px;background:var(--primary);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;box-shadow:0 3px 9px rgba(27,91,240,.24)}
.crt:active{background:var(--primary-d)}
.sc{background:var(--surface);border-radius:16px;padding:14px 14px 11px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,31,74,.06);transition:transform .12s}
.sc:active{transform:scale(.985)}
.sc-top{display:flex;align-items:flex-start;gap:12px}
.sc-thumb{width:50px;height:50px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(20,31,74,.16)}
.sc-tt{flex:1;min-width:0}
.sc-tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:650;line-height:1.45}
.sc-tt span{display:block;font-size:11.5px;color:var(--t3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-go{width:26px;height:26px;border-radius:50%;background:#F2F5FA;color:var(--t3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.sc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.sc-tags i{font-style:normal;font-size:10.5px;line-height:1.7;padding:1px 9px;border-radius:99px;background:#EEF2F9;color:var(--t2);white-space:nowrap;font-weight:500}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px dashed #E8ECF4;font-size:11px}
.sc-cnt{color:var(--primary);font-weight:550}
.sc-role{color:var(--t3)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,30,50,.88);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#B9C4D8;animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.composer{flex-shrink:0;background:#fff;border-top:1px solid var(--bd);padding:9px 14px 26px;display:flex;gap:9px;align-items:center}
.composer input{flex:1;height:40px;border:1px solid var(--bd2);border-radius:12px;padding:0 13px;font-size:13.5px;font-family:inherit;outline:none}
.micb{width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* 语音沉浸陪练（参考布局：全屏形象 + 气泡挂操作条 + 按住说话） */
/* 语音沉浸陪练（参考：实时通话界面——全屏形象 + 通话状态 + 四键控制） */
.vpage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;background:radial-gradient(125% 72% at 50% 2%,#2C5CB4 0%,#173572 44%,#0C1733 100%)}
/* 通话主区：全屏形象 */
.v-call{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding:2px 0 0;z-index:4}
.v-avatar{position:relative;width:248px;height:248px;margin-top:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v-avatar img{width:222px;height:222px;object-fit:contain;filter:drop-shadow(0 16px 34px rgba(0,0,0,.5));position:relative;z-index:2}
.v-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(150,220,255,.34);animation:vring 3s infinite ease-out}
.v-ring.r1{inset:6px}.v-ring.r2{inset:-14px;animation-delay:1s}.v-ring.r3{inset:-34px;animation-delay:2s}
@keyframes vring{0%{transform:scale(.86);opacity:.55}100%{transform:scale(1.16);opacity:0}}
/* 正在聆听状态胶囊 */
.v-pill{display:flex;align-items:center;gap:9px;margin-top:8px;background:rgba(4,9,22,.5);border:1px solid rgba(255,255,255,.13);border-radius:99px;padding:7px 17px;font-size:12.5px;color:#fff;flex-shrink:0}
.v-bars{display:flex;gap:3px;align-items:flex-end;height:13px;transition:opacity .3s}
.v-bars i{width:3px;background:#fff;border-radius:2px;animation:vbar 1s infinite ease-in-out}
@keyframes vbar{0%,100%{height:4px}50%{height:13px}}
/* 实时字幕 */
.v-sub{width:100%;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 14px 6px}
.v-sub::-webkit-scrollbar{width:0}
.vbub{max-width:92%;border-radius:16px;padding:11px 12px;font-size:13.5px;line-height:1.6}
.vbub.ai{align-self:flex-start;background:rgba(9,18,40,.78);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.26)}
.vbub.me{align-self:flex-end;background:rgba(255,255,255,.95);color:var(--t1);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.vbub .vrow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.vbub .vc{font-size:11px;padding:3.5px 10px;border-radius:99px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.22)}
.vbub.me .vc{background:#F0F4FB;color:var(--t2);border-color:#E1E7F2}
.vbub .vc.on{background:rgba(255,255,255,.3);color:#fff;border-color:rgba(255,255,255,.5)}
.vbub.me .vc.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.vspk{margin-left:auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#7FD8FF;flex-shrink:0}
.vbub.me .vspk{background:#EDF3FE;color:var(--primary)}
.vextra{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.7}
.vbub.ai .vextra{background:rgba(255,255,255,.1)}
.vbub.me .vextra{background:#F2F6FD}

function vMore(){const m=document.getElementById('vmenu'),p=document.getElementById('vplus'),h=document.getElementById('vhint');if(!m)return;p.style.display='none';h.style.display='none';m.style.display=m.style.display==='block'?'none':'block';}
let FAB={x:null,y:null,ox:0,oy:0,sx:0,sy:0,moved:false,drag:false};
function vFabDown(e){const el=document.getElementById('vfab');if(!el)return;
  const r=el.getBoundingClientRect();
  FAB.drag=true;FAB.moved=false;FAB.ox=e.clientX-r.left;FAB.oy=e.clientY-r.top;FAB.sx=e.clientX;FAB.sy=e.clientY;
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();}
function vFabMove(e){if(!FAB.drag)return;const el=document.getElementById('vfab');if(!el)return;
  if(!FAB.moved&&(Math.abs(e.clientX-FAB.sx)>4||Math.abs(e.clientY-FAB.sy)>4))FAB.moved=true;
  if(!FAB.moved)return;
  const p=el.parentElement.getBoundingClientRect();
  let x=e.clientX-FAB.ox-p.left,y=e.clientY-FAB.oy-p.top;
  x=Math.max(4,Math.min(p.width-el.offsetWidth-4,x));
  y=Math.max(4,Math.min(p.height-el.offsetHeight-4,y));
  FAB.x=Math.round(x);FAB.y=Math.round(y);
  el.style.left=x+'px';el.style.top=y+'px';el.style.right='auto';el.style.bottom='auto';
  e.preventDefault();}
function vFabUp(e){if(!FAB.drag)return;FAB.drag=false;const el=document.getElementById('vfab');
  if(el&&el.hasPointerCapture&&el.hasPointerCapture(e.pointerId)){try{el.releasePointerCapture(e.pointerId);}catch(_){}}
  if(!FAB.moved)vMore();}
function vFabCancel(){FAB.drag=false;}

/* ============ 雷达 ============ */
function drawRadar(elId,size){
  const el=document.getElementById(elId);if(!el)return;
  const cx=size/2,cy=size/2,R=size*0.33,n=6,dims=dim6.map(d=>d[0]),vals=dim6.map(d=>d[1]),avg=[72,70,74,66,62,75];
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let h='';
  [.25,.5,.75,1].forEach(k=>h+='<polygon points="'+dims.map((_,i)=>pt(i,R*k).join(',')).join(' ')+'" fill="'+(k===1?'#FAFCFF':'none')+'" stroke="#E5E9F2"/>');
  dims.forEach((d,i)=>{const[x,y]=pt(i,R);h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#E5E9F2"/>';
   const[lx,ly]=pt(i,R+21);const an=lx>cx+4?'start':(lx<cx-4?'end':'middle');
   h+='<text x="'+lx+'" y="'+ly+4+'" font-size="11" fill="#5B6478" text-anchor="'+an+'" font-family="-apple-system,PingFang SC,sans-serif">'+d+'</text>';});
  h+='<polygon points="'+avg.map((v,i)=>pt(i,R*v/100).join(',')).join(' ')+'" fill="none" stroke="#C4D6FF" stroke-width="1.5" stroke-dasharray="4 3"/>';
  h+='<polygon points="'+vals.map((v,i)=>pt(i,R*v/100).join(',')).join(' ')+'" fill="rgba(27,91,240,.15)" stroke="#1B5BF0" stroke-width="2"/>';
  el.innerHTML='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block;margin:0 auto">'+h+'</svg>';
}
