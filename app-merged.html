<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI陪练 · 学员端（合并版）</title>
<style>
:root{
  --primary:#1B5BF0; --primary-d:#1248C8; --p-bg:#EBF1FF; --p-bd:#C4D6FF;
  --cyan:#04C6EE; --grad:linear-gradient(135deg,#04C6EE,#175EF5);
  --bg:#F3F5FA; --surface:#FFF; --bd:#E8ECF4; --bd2:#D9DFEB;
  --t1:#1A2233; --t2:#5B6478; --t3:#939BAD;
  --ok:#12A760; --ok-bg:#E6F7EF; --warn:#E8960C; --warn-bg:#FFF5E3; --bad:#E0453F; --bad-bg:#FDECEB;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(160deg,#E9EEF8,#DDE6F5);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:0}

.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 30px 80px rgba(20,31,74,.35),0 0 0 10px #10173A,0 0 0 12px #2A3563;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#0B1020;border-radius:14px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1);z-index:62;pointer-events:none}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-r svg{display:block}
.statusbar.light{color:#fff}
.statusbar.solid{background:#fff}

.appbody{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:44px}
.page{flex:1;overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column}
.page::-webkit-scrollbar{width:0}
.page>*{flex-shrink:0}
.page>.subhead{margin:0 -16px}
.page.bleed{margin-top:-44px}

/* tabbar */
.tabbar{flex-shrink:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding:7px 6px 20px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--t3)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--primary);font-weight:600}

/* 顶栏（二级页） */
.subhead{position:sticky;top:0;z-index:30;display:flex;align-items:center;padding:8px 12px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.subhead .bk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.subhead .bk:active{background:var(--bg)}
.subhead b{position:absolute;left:0;right:0;top:8px;line-height:34px;text-align:center;font-size:16.5px;font-weight:650;pointer-events:none}
.subhead .r{position:absolute;right:12px;top:8px;height:34px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--primary);font-weight:550}
.subhead .phb{width:30px;height:30px;border-radius:50%;background:var(--p-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.subhead .phb:active{background:#dbe6ff}
.subhead .phb.txtb{font-size:13px;font-weight:650;line-height:1}

/* 首页头部 */
.home-head{margin:0 -16px;padding:64px 16px 18px;background:radial-gradient(130% 110% at 88% -25%,rgba(255,255,255,.32),transparent 55%),var(--grad);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 10px 26px rgba(23,94,245,.22)}
.home-head .row{display:flex;align-items:center;gap:10px}
.home-head .row img{height:26px}
.home-head .hello{margin-top:14px;font-size:19px;font-weight:700}
.home-head .hello span{font-size:13px;font-weight:400;opacity:.85;display:block;margin-top:2px}
.bell{margin-left:auto;position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.bell i{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:#FF4D4F;border-radius:99px;font-size:9.5px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}

/* 卡片 */
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.sec-t{display:flex;align-items:center;margin:16px 0 9px}
.sec-t b{font-size:15px;font-weight:650}
.sec-t a{margin-left:auto;font-size:12px;color:var(--t3)}
.mt{margin-top:12px}

/* 任务页大标题 */
.pg-h1{font-size:22px;font-weight:750;color:var(--t1);margin:8px 0 10px;letter-spacing:.2px}

/* 任务卡（列表版，参考稿样式） */
.tk{background:var(--surface);border-radius:16px;padding:16px 15px 13px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,31,74,.06);transition:transform .12s}
.tk:active{transform:scale(.985)}
.tk-top{display:flex;align-items:flex-start;gap:10px}
.tk-name{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.4;color:var(--t1)}
.tk-badge{flex-shrink:0;font-size:11px;font-weight:550;line-height:1;padding:5px 10px;border-radius:99px;background:#E8F0FE;color:var(--primary);white-space:nowrap}
.tk-desc{margin:8px 0 0;font-size:12.5px;line-height:1.7;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk-bar{height:6px;border-radius:3px;background:#E9EEF7;margin-top:12px;overflow:hidden}
.tk-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2F6BFF,#4E8DFF)}
.tk-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.tk-dl{font-size:11.5px;color:var(--t3)}
.tk-pct{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--primary)}
.tk-pct svg{margin-top:.5px}
.task-hero{background:linear-gradient(120deg,#175EF5,#3E8BFF);border-radius:16px;padding:15px;color:#fff;box-shadow:0 8px 20px rgba(23,94,245,.3)}
.task-hero .tag{font-size:10.5px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:99px}
.task-hero b.t{display:block;font-size:15.5px;margin:7px 0 3px}
.task-hero p{font-size:11.5px;opacity:.85}
.prog{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:3px}

/* 快捷入口 */
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.q{background:var(--surface);border-radius:14px;padding:13px 4px;text-align:center;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.q .ic{width:40px;height:40px;margin:0 auto 7px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.q b{font-size:11.5px;font-weight:600;display:block}
.ic-b{background:var(--p-bg);color:var(--primary)}
.ic-g{background:#E6F7F0;color:#0DA678}
.ic-o{background:#FFF3E4;color:#F08A0C}
.ic-p{background:#F1EDFF;color:#6E4EEA}
.ic-c{background:#E0F6FB;color:#0AA3C6}

/* 通用条目 */
.item{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:14px;padding:13px 14px;box-shadow:0 1px 3px rgba(20,31,74,.05);margin-bottom:9px}
.item .thumb{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:650}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tt span{font-size:11.5px;color:var(--t3);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{color:var(--t3);flex-shrink:0}
.bar{height:5px;background:#EDEFF5;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.bar i.g{background:var(--ok)}.bar i.w{background:var(--warn)}.bar i.d{background:var(--bad)}
.st{display:inline-flex;align-items:center;padding:1.5px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}.st.info{background:var(--p-bg);color:var(--primary)}
.st.gray{background:#EEF0F5;color:var(--t3)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-size:14.5px;font-weight:600}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(27,91,240,.3)}
.btn-p:active{background:var(--primary-d)}
.btn-g{background:#fff;border:1px solid var(--bd2);color:var(--t2)}
.btn-dis{background:#E7EAF1;color:var(--t3);box-shadow:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.chips::-webkit-scrollbar{height:0}
.chips.tight{gap:6px;padding:0;margin:0}
.chips.tight + .chips.tight{margin:6px 0 9px}
.chips.tight .chip{padding:4px 11px;font-size:11.5px}
.chips.tight .chip.on{font-weight:600}
.chip{flex-shrink:0;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--bd);font-size:12.5px;color:var(--t2)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:9px 13px;margin-bottom:11px;color:var(--t3);font-size:13px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:none}

/* 剧本详情 */
.cover{margin:0 -16px;padding:20px 16px 18px;background:radial-gradient(130% 110% at 88% -25%,rgba(255,255,255,.32),transparent 55%),var(--grad);color:#fff}
.cover h1{font-size:19px;font-weight:700;margin-bottom:6px}
.cover p{font-size:12.5px;opacity:.88;line-height:1.6}
.pill{display:inline-block;font-size:11px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;margin-right:6px;margin-top:8px}
.persona-pick{display:flex;gap:9px}
.pp{flex:1;border:1.5px solid var(--bd);border-radius:13px;padding:11px;text-align:center;cursor:pointer}
.pp.on{border-color:var(--primary);background:#F6F9FF}
.pp .av{width:40px;height:40px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:650;font-size:15px}
.pp b{font-size:12.5px;display:block}
.pp span{font-size:10.5px;color:var(--t3)}
.pp-add{flex:1;border:1.5px dashed #C7D2E8;border-radius:13px;padding:11px;text-align:center;color:var(--primary);cursor:pointer;background:#F8FAFF}
.pp-add .av{width:40px;height:40px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;background:#E3EDFF;color:var(--primary)}
.pp-add b{font-size:12.5px;display:block}
.pp-add span{font-size:10.5px;color:var(--t3)}
/* 自定义客户表单 */
.f-lab{display:block;font-size:12px;color:var(--t2);font-weight:600;margin:13px 0 0}
.f-lab:first-child{margin-top:0}
.f-in{width:100%;border:1px solid var(--bd2);border-radius:11px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;margin-top:6px}
.f-in:focus{border-color:var(--primary)}
.f-cnt{font-size:10.5px;color:var(--t3);margin-top:4px}
.info-kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.info-kv:last-child{border:none}
.info-kv span{color:var(--t3)}
.info-kv b{font-weight:600}

/* 陪练执行 */
.chatpage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#EAF2FF 0%,#F3F5FA 30%)}
.chat-head{flex-shrink:0;background:#fff;border-bottom:1px solid var(--bd);padding:8px 16px 10px;display:flex;align-items:center;gap:9px}
.chat-head .end{margin-left:auto;color:var(--bad);font-size:13px;font-weight:600}
.timer{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;background:var(--bg);padding:3px 9px;border-radius:99px}
.chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;max-width:85%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.mav{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:650;overflow:hidden}
.mav.ai{background:#fff;box-shadow:0 2px 6px rgba(23,94,245,.18)}
.mav.ai img{width:100%;height:100%;object-fit:contain}
.mav.self{background:linear-gradient(135deg,#12A760,#3FC98A)}
.bub{background:#fff;border-radius:3px 14px 14px 14px;padding:10px 13px;font-size:13.5px;line-height:1.65;box-shadow:0 1px 3px rgba(20,31,74,.06)}
.msg.me .bub{background:var(--primary);color:#fff;border-radius:14px 3px 14px 14px}
/* 文字对话页：气泡操作条（推荐话术/评分/优化） */
.crow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ccb{font-size:11px;padding:3.5px 10px;border-radius:99px;background:#fff;border:1px solid var(--bd);color:var(--t2)}
.ccb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cextra{margin-top:6px;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.7;background:#F2F6FD;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.cextra b{display:block;margin-bottom:2px;font-size:11px;color:var(--primary)}
.cextra .mut{color:var(--t3)}
/* 剧本列表：头部 + 卡片 + toast */
.s-head{display:flex;gap:9px;align-items:center}
.search.s-short{flex:1;margin-bottom:0;padding:8px 12px}
.crt{flex-shrink:0;height:29px;padding:0 10px;border-radius:9px;background:var(--primary);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;box-shadow:0 3px 9px rgba(27,91,240,.24)}
.crt:active{background:var(--primary-d)}
.sc{background:var(--surface);border-radius:16px;padding:14px 14px 11px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,31,74,.06);transition:transform .12s}
.sc:active{transform:scale(.985)}
.sc-top{display:flex;align-items:flex-start;gap:12px}
.sc-thumb{width:50px;height:50px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(20,31,74,.16)}
.sc-tt{flex:1;min-width:0}
.sc-tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:650;line-height:1.45}
.sc-tt span{display:block;font-size:11.5px;color:var(--t3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-go{width:26px;height:26px;border-radius:50%;background:#F2F5FA;color:var(--t3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.sc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.sc-tags i{font-style:normal;font-size:10.5px;line-height:1.7;padding:1px 9px;border-radius:99px;background:#EEF2F9;color:var(--t2);white-space:nowrap;font-weight:500}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px dashed #E8ECF4;font-size:11px}
.sc-cnt{color:var(--primary);font-weight:550}
.sc-role{color:var(--t3)}

/* ===== 快速创建（AI 生成剧本 / 客户）===== */
.seg{display:flex;background:#EDF1F8;border-radius:12px;padding:3px;margin:12px 0 0}
.seg-i{flex:1;text-align:center;font-size:12.5px;color:var(--t2);padding:8px 0;border-radius:9px;font-weight:550;display:flex;align-items:center;justify-content:center;gap:4px}
.seg-i.on{background:#fff;color:var(--primary);font-weight:650;box-shadow:0 1px 4px rgba(20,31,74,.1)}
.crt-card{background:#fff;border-radius:15px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.ai-lead{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650}
.ai-lead em{font-style:normal;font-size:10px;font-weight:600;color:var(--primary);background:var(--p-bg);border:1px solid var(--p-bd);padding:1px 6px;border-radius:99px}
.ai-ta{width:100%;border:1px solid var(--bd2);border-radius:12px;padding:11px 12px;font-size:13px;font-family:inherit;line-height:1.65;outline:none;resize:none;margin-top:9px;background:#FBFCFE;color:var(--t1)}
.ai-ta:focus{border-color:var(--primary);background:#fff}
.ai-ta::placeholder{color:#AAB3C5}
.ai-hint{font-size:10.5px;color:var(--t3);margin-top:7px;line-height:1.6}
.qt{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qt b{font-size:10.5px;font-weight:500;color:var(--t2);background:#F2F5FA;border:1px solid var(--bd);border-radius:99px;padding:4px 9px}
.qt b:active{background:var(--p-bg);border-color:var(--p-bd);color:var(--primary)}
.qt b.on{background:var(--p-bg);border-color:var(--p-bd);color:var(--primary);font-weight:650}
.gen-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:44px;border-radius:13px;background:var(--grad);color:#fff;font-size:14.5px;font-weight:650;box-shadow:0 6px 16px rgba(23,94,245,.28);margin-top:12px}
.gen-btn:active{opacity:.9}
.gen-btn.dis{opacity:.55;box-shadow:none}
.gen-busy{padding:4px 2px 2px}
.gen-busy .gl{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t2);padding:7px 0}
.gen-busy .gl em{width:15px;height:15px;border-radius:50%;border:2px solid var(--p-bd);border-top-color:var(--primary);animation:spin .8s linear infinite;font-style:normal;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.sn-hero{margin-top:12px;border-radius:16px;padding:14px 15px 13px;background:radial-gradient(130% 120% at 86% -20%,rgba(255,255,255,.32),transparent 60%),var(--grad);color:#fff;box-shadow:0 10px 24px rgba(23,94,245,.22)}
.sn-hero .sh-t{font-size:10.5px;opacity:.85;display:flex;align-items:center;gap:5px}
.sn-hero h2{font-size:17px;font-weight:700;line-height:1.4;margin-top:6px}
.sn-hero .sh-p{font-size:12px;opacity:.9;line-height:1.65;margin-top:6px}
.sn-hero .sh-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sn-hero .sh-tags i{font-style:normal;font-size:10.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);padding:2.5px 8px;border-radius:99px}
.sn-hero .sh-name{width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:11px;color:#fff;font-size:15.5px;font-weight:700;font-family:inherit;padding:8px 10px;outline:none;margin-top:7px;line-height:1.4}
.sn-hero .sh-name:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
.sn-sec{background:#fff;border-radius:14px;padding:13px 14px 14px;margin-top:10px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.sn-h{display:flex;align-items:center;gap:7px}
.sn-h .sn-n{width:18px;height:18px;border-radius:6px;background:var(--p-bg);color:var(--primary);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sn-h b{font-size:13.5px;font-weight:650}
.sn-h .redo{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--t3);padding:3px 7px;border-radius:8px;background:#F5F7FB}
.sn-h .redo:active{color:var(--primary);background:var(--p-bg)}
.sn-p{font-size:12.5px;color:var(--t2);line-height:1.72;margin-top:8px}
.sn-line{display:flex;gap:6px;font-size:12px;line-height:1.7;margin-top:6px}

/* 语音沉浸陪练（参考布局：全屏形象 + 气泡挂操作条 + 按住说话） */
/* 语音沉浸陪练（参考：实时通话界面——全屏形象 + 通话状态 + 四键控制） */
.vpage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;background:radial-gradient(125% 72% at 50% 2%,#2C5CB4 0%,#173572 44%,#0C1733 100%)}
/* 通话主区：全屏形象 */
.v-call{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding:2px 0 0;z-index:4}
.v-avatar{position:relative;width:248px;height:248px;margin-top:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v-avatar img{width:222px;height:222px;object-fit:contain;filter:drop-shadow(0 16px 34px rgba(0,0,0,.5));position:relative;z-index:2}
.v-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(150,220,255,.34);animation:vring 3s infinite ease-out}
.v-ring.r1{inset:6px}.v-ring.r2{inset:-14px;animation-delay:1s}.v-ring.r3{inset:-34px;animation-delay:2s}
@keyframes vring{0%{transform:scale(.86);opacity:.55}100%{transform:scale(1.16);opacity:0}}
/* 正在聆听状态胶囊 */
.v-pill{display:flex;align-items:center;gap:9px;margin-top:8px;background:rgba(4,9,22,.5);border:1px solid rgba(255,255,255,.13);border-radius:99px;padding:7px 17px;font-size:12.5px;color:#fff;flex-shrink:0}
.v-bars{display:flex;gap:3px;align-items:flex-end;height:13px;transition:opacity .3s}
.v-bars i{width:3px;background:#fff;border-radius:2px;animation:vbar 1s infinite ease-in-out}
@keyframes vbar{0%,100%{height:4px}50%{height:13px}}
/* 实时字幕 */
.v-sub{width:100%;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 14px 6px}
.v-sub::-webkit-scrollbar{width:0}
.vbub{max-width:92%;border-radius:16px;padding:11px 12px;font-size:13.5px;line-height:1.6}
.vbub.ai{align-self:flex-start;background:rgba(9,18,40,.78);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.26)}
.vbub.me{align-self:flex-end;background:rgba(255,255,255,.95);color:var(--t1);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.vbub .vrow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.vbub .vc{font-size:11px;padding:3.5px 10px;border-radius:99px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.22)}
.vbub.me .vc{background:#F0F4FB;color:var(--t2);border-color:#E1E7F2}
.vbub .vc.on{background:rgba(255,255,255,.3);color:#fff;border-color:rgba(255,255,255,.5)}
.vbub.me .vc.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.vspk{margin-left:auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#7FD8FF;flex-shrink:0}
.vbub.me .vspk{background:#EDF3FE;color:var(--primary)}
.vextra{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.7}
.vbub.ai .vextra{background:rgba(255,255,255,.1)}
.vbub.me .vextra{background:#F2F6FD}
.vextra b{display:block;margin-bottom:2px;font-size:11px}
.vbub.ai .vextra b{color:#8FD9FF}.vbub.me .vextra b{color:var(--primary)}
.vextra .mut{color:var(--t3)}
.vtyping{display:flex;gap:4px;padding:13px 15px}
.vtyping i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);animation:tp 1.2s infinite}
.vtyping i:nth-child(2){animation-delay:.2s}.vtyping i:nth-child(3){animation-delay:.4s}
/* 通话控制栏：四键等大横排 */
.v-controls{flex-shrink:0;position:relative;z-index:6;padding:6px 22px 20px}
.v-keys{display:flex;align-items:flex-start;justify-content:space-around}
/* 悬浮可拖动的设置入口 */
.v-fab{position:absolute;right:12px;bottom:104px;z-index:12;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.v-fab:active{cursor:grabbing;background:rgba(255,255,255,.3)}
.v-key{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;color:rgba(255,255,255,.9);font-size:10.5px;font-family:inherit;cursor:pointer;padding:0;width:60px}

.v-key.on .ic{background:rgba(127,216,255,.26);box-shadow:0 0 0 2px rgba(127,216,255,.5)}

/* 文字输入与菜单 */

function pnPick(prompt,ver){
  const p=(prompt||'').toLowerCase();
  const sc=PERSONA_POOL.map((c,i)=>({i:i,hit:c.k.reduce((n,k)=>n+(p.indexOf(k)>=0?1:0),0)}));
  sc.sort((a,b)=>b.hit-a.hit||a.i-b.i);
  return sc[(ver||0)%sc.length].i;
}

let PN={prompt:'',draft:null,busy:false,ver:0,manual:false,style:'',voice:'',speed:''};
function pnOpen(){PN={prompt:'',draft:null,busy:false,ver:0,manual:false,style:'',voice:'',speed:''};navTo('personaNew');}
function pnMode(m){PN.manual=!!m;PN.style='';PN.voice='';PN.speed='';render();}
function pnPrompt(v){PN.prompt=v;}
function pnQt(i){PN.prompt=P_QTIPS[i].p;render();}
function pnSet(k,v){PN[k]=v;if(PN.draft)PN.draft[k]=v;render();}
function pnGen(){
  if(PN.busy)return;
  if(!(PN.prompt||'').trim()){toast('先用一句话描述这位客户');return;}
  PN.busy=true;render();
  setTimeout(()=>{PN.draft=pnBuild();PN.busy=false;render();},900);
}
function pnBuild(){
  const c=PERSONA_POOL[pnPick(PN.prompt,PN.ver)];
  return {name:c.name,role:c.role,sex:c.sex,age:c.age,job:c.job,fam:c.fam,
    style:PN.style||c.style,voice:PN.voice||c.voice,speed:PN.speed||c.speed,
    tags:c.tags.slice(),desc:c.desc,focus:c.focus,tip:c.tip};
}
function pnAnother(){PN.ver++;PN.style='';PN.voice='';PN.speed='';PN.draft=pnBuild();render();}
function pnCommit(d){
  CUSTOM_P.push({name:d.name,role:d.role,style:d.style,voice:d.voice,sex:d.sex,age:d.age,job:d.job,tags:d.tags.slice(),desc:d.desc});
  PINFO[d.name+' \u00b7 '+d.role]={tag:d.tags.slice(0,4),focus:d.focus||'由你定义：这位客户最在意什么',tip:d.tip||'先问后说，用提问挖需求'};
  PRAC.persona=pList(SCRIPTS[SCRIPT]).length-1;
  toast('已创建并选用：'+d.name);
  back();
}
function pnCommitDraft(){if(PN.draft)pnCommit(PN.draft);}
function pnSaveManual(){
  const g=id=>{const e=document.getElementById(id);return e?(e.value||'').trim():'';};
  const name=g('pnName');
  if(!name){toast('先填一下客户称呼');return;}
  const role=g('pnRole')||'自定义客户';
  const desc=g('pnDesc');
  const st=PN.style||'理性分析型';
  const tags=desc?desc.replace(/[，。；、]/g,' ').split(/\s+/).filter(Boolean).slice(0,3):['需建立信任'];
  pnCommit({name:name,role:role,sex:PN.voice&&PN.voice.indexOf('女')>=0?'女':'男',age:'35–44岁',job:role,
    style:st,voice:PN.voice||'男声 · 成熟',speed:PN.speed||'正常',
    tags:tags.length?tags:['需建立信任'],desc:desc||'由你自定义的陪练客户，按所选风格进行角色扮演。',
    focus:'由你定义：这位客户最在意什么',tip:'先问后说，用提问挖需求'});

let SN={mode:'ai',prompt:'',cust:0,diff:'自动',ver:0,busy:false,draft:null,mname:'',mwhat:''};
function snOpen(){SN={mode:'ai',prompt:'',cust:0,diff:'自动',ver:0,busy:false,draft:null,mname:'',mwhat:''};navTo('scriptNew');}
function snMode(m){SN.mode=m;render();}
function snQt(i){SN.prompt=S_QTIPS[i].p;render();}
function snCust(i){SN.cust=i;render();}
function snDiff(d){SN.diff=d;render();}
function snPick(prompt,ver){
  const p=(prompt||'').toLowerCase();
  const sc=S_TPL.map((t,i)=>({i:i,hit:t.k.reduce((n,k)=>n+(p.indexOf(k)>=0?1:0),0)}));
  sc.sort((a,b)=>b.hit-a.hit||a.i-b.i);
  if(!sc[0].hit)return S_TPL.length-1;
  return sc[(ver||0)%sc.length].i;
}
function snBuild(){
  const t=S_TPL[snPick(SN.prompt,SN.ver)];
  const c=PERSONA_POOL[SN.cust]||PERSONA_POOL[0];
  return {name:t.name,desc:t.desc,goal:t.goal,scene:t.scene,first:t.first,
    diff:SN.diff==='自动'?t.diff:SN.diff,time:t.time,radar:t.radar,
    cust:[c.name+' \u00b7 '+c.role],
    flow:t.flow.map(f=>JSON.parse(JSON.stringify(f))),
    dims:t.dims.map(d=>d.slice()),mats:t.mats.map(m=>m.slice()),userName:false};
}
function snGen(){
  if(SN.busy)return;
  if(!(SN.prompt||'').trim()){toast('先说一句你想练什么');return;}
  SN.busy=true;render();
  setTimeout(()=>{SN.draft=snBuild();SN.busy=false;navTo('scriptNewResult');},1150);
}
function snRefresh(){
  const old=SN.draft;SN.ver++;
  const n=snBuild();
  if(old&&old.userName){n.name=old.name;n.userName=true;}
  SN.draft=n;render();toast('已重新生成一版');
}
function snName(v){if(SN.draft){SN.draft.name=v;SN.draft.userName=true;}}
function snNextCust(){SN.cust=(SN.cust+1)%PERSONA_POOL.length;
  if(SN.draft){const c=PERSONA_POOL[SN.cust];SN.draft.cust=[c.name+' \u00b7 '+c.role];}render();}
function snDelMat(n){if(!SN.draft)return;SN.draft.mats=SN.draft.mats.filter(m=>m[0]!==n);render();toast('已移除该素材');}
function snSave(){
  const d=SN.draft;if(!d)return;
  const name=(d.name||'').trim();
  if(!name){toast('剧本名称不能为空');return;}
  const id=SCRIPTS.length;
  SCRIPTS.push({id:id,name:name,type:'情景对话',time:d.time,diff:d.diff,
    cnt:'新建 · 未开始',desc:d.desc,goal:d.goal,personas:d.cust,
    scene:d.scene,first:d.first,flow:d.flow,dims:d.dims,mats:d.mats,radar:d.radar,from:'自建'});
  STACK=['scripts'];SCRIPT=id;PRAC.taskId=null;PRAC.persona=0;
  navTo('scriptDetail');toast('剧本已创建，可直接开始陪练');
}
function snCreateManual(){
  const ne=document.getElementById('snMN'), we=document.getElementById('snMW');
  const nm=((ne?ne.value:SN.mname)||'').trim();
  if(!nm){toast('先填个剧本名称');return;}
  SN.mname=nm;
  SN.prompt=(((we?we.value:SN.mwhat)||'')).trim();
  SN.ver=0;SN.draft=snBuild();SN.draft.name=nm;SN.draft.userName=true;
  snSave();
}

let CUSTOM_P=[];
function pList(s){return s.personas.concat(CUSTOM_P.map(c=>c.name+' \u00b7 '+c.role));}
SCREENS.scriptDetail=()=>{const s=SCRIPTS[SCRIPT];const plist=pList(s);const free=!PRAC.taskId;
 if(PRAC.persona>=plist.length)PRAC.persona=0;
 const p=plist[PRAC.persona],pi=pInfo(p);
 return '<div class="page"><div class="cover"><h1>'+s.name+'</h1><p>'+s.desc+'</p><span class="pill">'+s.type+'</span><span class="pill">'+s.diff+'</span><span class="pill">'+s.time+'</span></div>'+
 '<div class="card mt"><div class="sec-t" style="margin:0 0 10px"><b>选择模拟客户</b><span style="font-size:11px;color:var(--t3);margin-left:6px">本场会话固定一位</span></div>'+
 '<div class="persona-pick" id="pp">'+plist.map((q,i)=>'<div class="pp'+(i===PRAC.persona?' on':'')+'" onclick="pickP('+i+')"><div class="av" style="background:'+(i===PRAC.persona?'linear-gradient(135deg,#175EF5,#04C6EE)':'linear-gradient(135deg,#F08A0C,#FFB84D)')+'">'+q[0]+'</div><b>'+q.split(' \u00b7 ')[0]+'</b><span>'+q.split(' \u00b7 ')[1]+'</span></div>').join('')+

 '<div class="ptags">'+pi.tag.map(t=>stTag(t,'info')).join('')+'</div>'+
 '<div class="kv2"><span>核心关注</span><b>'+pi.focus+'</b></div>'+
 '<div class="kv2"><span>应对要点</span><b>'+pi.tip+'</b></div></div></div>'+

function pickP(i){PRAC.persona=i;
 document.querySelectorAll('#pp .pp').forEach((n,j)=>n.classList.toggle('on',j===i));
 const p=pList(SCRIPTS[SCRIPT])[i],pi=pInfo(p),el=document.querySelector('.psel');

let replyIdx=0,timerIv=null,sec=0,PMODE='text',PREC=false,PRECSEC=0,PRECIV=null;
function startPractice(){
  sec=0;replyIdx=0;PMODE='text';
  CHAT=[{who:'ai',txt:'你好，我看了你们银河E5的资料，今天主要想了解价格，你们最低能优惠多少？',ex:'王总您好！优惠肯定有，不过比价得同配置比。方便先说下您看中的竞品是哪个版本吗？咱们拉平了算总账。',show:{}}];
  navTo('practice');
}
function startTimer(){clearInterval(timerIv);timerIv=setInterval(()=>{sec++;const t=document.getElementById('pTimer');if(t)t.textContent=fmt(sec);const v=document.getElementById('vTimer');if(v)v.textContent=fmt(sec);},1000);}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function aiMsg(){const a=AI_REPLIES[replyIdx++%AI_REPLIES.length];return {who:'ai',txt:a.txt,ex:a.ex,show:{}};}
function meMsg(txt,voice,dur){const e=VME[replyIdx%VME.length];
 const m={who:'me',txt:txt||e.txt,fix:e.fix,opt:e.opt,
  score:{t:'本句评分 '+e.sc+' / 10',d:'挖需 8 · 异议处理 8 · 沟通表达 9',note:'没有硬碰硬回价，用反问稳住节奏；建议补一句量化对比，说服力更强。'},show:{}};
 if(voice){m.voice=true;m.dur=dur||3;}return m;}
function cTgl(i,k){const m=CHAT[i];if(!m.show)m.show={};m.show[k]=!m.show[k];render();}
function meExtras(m,i){return (m.show&&m.show.score?'<div class="cextra"><b>'+m.score.t+'</b>'+m.score.d+'<br><span class="mut">'+m.score.note+'</span></div>':'')+
 (m.show&&m.show.opt?'<div class="cextra"><b>优化</b><span class="mut">原句：「'+m.fix.bad+'」→ 建议：「'+m.fix.good+'」</span><br>'+m.opt.t+'<br><span class="mut">'+m.opt.d+'</span></div>':'')+
 '<div class="crow"><button class="ccb'+(m.show&&m.show.score?' on':'')+'" onclick="cTgl('+i+',\'score\')">评分</button><button class="ccb'+(m.show&&m.show.opt?' on':'')+'" onclick="cTgl('+i+',\'opt\')">优化</button></div>';}

function vTgl(i,k){const m=VCHAT[i];if(!m.show)m.show={};m.show[k]=!m.show[k];render();}
function vPlay(el){el.style.color='#FFD76A';setTimeout(()=>{el.style.color='';},900);}
function vSay(t){document.getElementById('vplus').style.display='none';vSend(t);}
function vSend(txt){
  const tpl=VME[VREPLY%VME.length];
  VCHAT.push({who:'me',txt:txt||tpl.txt,en:tpl.en,fix:tpl.fix,opt:tpl.opt,score:{t:'本句评分 '+tpl.sc+' / 10',d:'挖需 8 · 异议处理 8 · 沟通表达 9',note:'没有硬碰硬回价，用反问稳住节奏；建议补一句量化对比，说服力更强。'},show:{}});
  render();
  setTimeout(()=>{VCHAT.push({who:'typing'});vSpeaking(true);render();
    setTimeout(()=>{VCHAT.pop();const a=VAI[VREPLY%VAI.length];VREPLY++;VCHAT.push({who:'ai',txt:a.txt,en:a.en,ex:a.ex,show:{}});vSpeaking(true);render();setTimeout(()=>vSpeaking(false),1700);},1300);
  },350);}


function backToText(){VMODE='语音';vTxtOpen=false;PRAC.mode='文字';PMODE='text';back();}
function vMore(){const m=document.getElementById('vmenu'),p=document.getElementById('vplus'),h=document.getElementById('vhint');if(!m)return;p.style.display='none';h.style.display='none';m.style.display=m.style.display==='block'?'none':'block';}
let FAB={x:null,y:null,ox:0,oy:0,sx:0,sy:0,moved:false,drag:false};
function vFabDown(e){const el=document.getElementById('vfab');if(!el)return;
  const r=el.getBoundingClientRect();
  FAB.drag=true;FAB.moved=false;FAB.ox=e.clientX-r.left;FAB.oy=e.clientY-r.top;FAB.sx=e.clientX;FAB.sy=e.clientY;
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();}
function vFabMove(e){if(!FAB.drag)return;const el=document.getElementById('vfab');if(!el)return;
  if(!FAB.moved&&(Math.abs(e.clientX-FAB.sx)>4||Math.abs(e.clientY-FAB.sy)>4))FAB.moved=true;
  if(!FAB.moved)return;
  const p=el.parentElement.getBoundingClientRect();
  let x=e.clientX-FAB.ox-p.left,y=e.clientY-FAB.oy-p.top;
  x=Math.max(4,Math.min(p.width-el.offsetWidth-4,x));
  y=Math.max(4,Math.min(p.height-el.offsetHeight-4,y));
  FAB.x=Math.round(x);FAB.y=Math.round(y);
  el.style.left=x+'px';el.style.top=y+'px';el.style.right='auto';el.style.bottom='auto';
  e.preventDefault();}
function vFabUp(e){if(!FAB.drag)return;FAB.drag=false;const el=document.getElementById('vfab');
  if(el&&el.hasPointerCapture&&el.hasPointerCapture(e.pointerId)){try{el.releasePointerCapture(e.pointerId);}catch(_){}}
  if(!FAB.moved)vMore();}
function vFabCancel(){FAB.drag=false;}

function vHint(){document.getElementById('vmenu').style.display='none';document.getElementById('vplus').style.display='none';const h=document.getElementById('vhint');h.style.display=h.style.display==='block'?'none':'block';}
function vToggle(name){const el=document.getElementById(name==='Mute'?'vkMute':'vkSpk');if(el)el.classList.toggle('on');}
function vSpeaking(on){const b=document.getElementById('vbars');if(b)b.style.opacity=on?'1':'.35';const st=document.getElementById('vstatus');if(st)st.textContent=on?'对方说话中…':'正在聆听';}
function vPlusOpen(){const m=document.getElementById('vmenu'),p=document.getElementById('vplus'),h=document.getElementById('vhint');if(m)m.style.display='none';if(h)h.style.display='none';if(p)p.style.display='block';}

function drawRadar(elId,size){
  const el=document.getElementById(elId);if(!el)return;
  const cx=size/2,cy=size/2,R=size*0.33,n=6,dims=dim6.map(d=>d[0]),vals=dim6.map(d=>d[1]),avg=[72,70,74,66,62,75];
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let h='';
  [.25,.5,.75,1].forEach(k=>h+='<polygon points="'+dims.map((_,i)=>pt(i,R*k).join(',')).join(' ')+'" fill="'+(k===1?'#FAFCFF':'none')+'" stroke="#E5E9F2"/>');
  dims.forEach((d,i)=>{const[x,y]=pt(i,R);h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#E5E9F2"/>';
   const[lx,ly]=pt(i,R+21);const an=lx>cx+4?'start':(lx<cx-4?'end':'middle');
   h+='<text x="'+lx+'" y="'+ly+4+'" font-size="11" fill="#5B6478" text-anchor="'+an+'" font-family="-apple-system,PingFang SC,sans-serif">'+d+'</text>';});
  h+='<polygon points="'+avg.map((v,i)=>pt(i,R*v/100).join(',')).join(' ')+'" fill="none" stroke="#C4D6FF" stroke-width="1.5" stroke-dasharray="4 3"/>';
  h+='<polygon points="'+vals.map((v,i)=>pt(i,R*v/100).join(',')).join(' ')+'" fill="rgba(27,91,240,.15)" stroke="#1B5BF0" stroke-width="2"/>';
  el.innerHTML='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block;margin:0 auto">'+h+'</svg>';
}


/* ===== 演示数据（生产环境由后台开通并下发初始密码）=====
   V1.1 模型：locked=全局锁定(所有租户不可登录)；firstLogin=初始密码须改密；
   tenants[].member=当前租户成员状态(停用则禁止进入该租户) */
const ACCOUNTS = {
  '13800001000': {name:'系统管理员', pwd:'Admin@123', locked:false, firstLogin:false,
    tenants:[{name:'长久集团', sub:'学员端', member:'启用', role:'集团管理员'}]},
  '13800006621': {name:'赵磊', pwd:'ChangPwd@123', locked:false, firstLogin:true,
    tenants:[{name:'长久集团', sub:'学员端', member:'启用', role:'门店培训管理员'}]},
  '13800002000': {name:'钱多多', pwd:'Test@123', locked:false, firstLogin:false,
    tenants:[{name:'长久集团', sub:'学员端', member:'启用', role:'销售顾问'},
             {name:'西南区域', sub:'学员端', member:'启用', role:'销售顾问'},
             {name:'华南区域', sub:'学员端', member:'停用', role:'销售顾问'}]},
  '13800003000': {name:'李文静', pwd:'Lock@123', locked:true, firstLogin:false,
    tenants:[{name:'石家庄裕华店', sub:'学员端', member:'启用', role:'销售顾问'}]}
};
const ATTEMPT_LIMIT = 5;
let attempts = {};
let curAcct = null;
let curTenant = null;

function $(id){return document.getElementById(id);}
function goStep(s){
  ['login','tenant','setpwd'].forEach(k=>{
    const el=$('step'+k.charAt(0).toUpperCase()+k.slice(1));
    el.classList.toggle('on', k===s);
  });
}
/* 退出登录：清空会话，恢复登录页 */
function logout(){
  curAcct=null; curTenant=null; STACK=['home'];
  const app=$('app');
  if(LOGIN_HTML) app.innerHTML=LOGIN_HTML;
  closeChPwd(); closeForgot();
  goStep('login');
  const ph=$('phone'), pw=$('pwd'), ag=$('agree');
  if(ph) ph.value=''; if(pw) pw.value=''; if(ag) ag.checked=false;
  clearErr('loginErr');
}
function showErr(box, tx){ $(box+'Tx').textContent = tx; $(box).classList.add('on'); }
function clearErr(box){ $(box).classList.remove('on'); }
function toggleEye(){ const i=$('pwd'); i.type = i.type==='password'?'text':'password'; }
function validPwd(p){ return p.length>=8 && /[A-Za-z]/.test(p) && /\d/.test(p); }

/* 步骤1：登录 */
function doLogin(){
  clearErr('loginErr');
  if(!$('agree').checked){ showErr('loginErr','请先阅读并同意《用户协议》和《隐私政策》'); return; }
  const phone=$('phone').value.trim();
  const pwd=$('pwd').value;
  if(!/^1\d{10}$/.test(phone)){ showErr('loginErr','请输入正确的 11 位手机号'); return; }
  if(!pwd){ showErr('loginErr','请输入登录密码'); return; }
  const acct=ACCOUNTS[phone];
  if(!acct){ showErr('loginErr','该手机号尚未开通账号，请联系企业管理员在后台开通'); return; }
  if(acct.locked){ showErr('loginErr','该账号已被全局锁定，所有租户均无法登录，请联系管理员'); return; }
  if(acct.pwd!==pwd){
    attempts[phone]=(attempts[phone]||0)+1;
    const left=ATTEMPT_LIMIT-attempts[phone];
    if(left<=0){ showErr('loginErr','密码连续错误次数过多，账号已临时锁定，请稍后或联系管理员'); return; }
    showErr('loginErr','密码错误，还可尝试 '+left+' 次（达到 '+ATTEMPT_LIMIT+' 次将临时锁定）'); return;
  }
  curAcct={phone,acct};
  attempts[phone]=0;
  afterAuth();
}
/* 一键登录（仅原型演示用）：勾选协议 + 填入演示账号并直接登录 */
function demoLogin(phone,pwd){
  const ag=$('agree'); if(ag) ag.checked=true;
  $('phone').value=phone; $('pwd').value=pwd;
  clearErr('loginErr');
  doLogin();
}
function afterAuth(){
  const avail=curAcct.acct.tenants.filter(t=>t.member==='启用');
  if(curAcct.acct.firstLogin){ goStep('setpwd'); return; }
  if(avail.length>1){ renderTenants(avail); goStep('tenant'); return; }
  finish(avail[0]||null);
}
function renderTenants(avail){
  let h='';
  curAcct.acct.tenants.forEach((t,i)=>{
    const ok=t.member==='启用';
    h+='<div class="tenant'+(ok?'':' disabled')+'" '+(ok?'onclick="pickTenant('+i+')"':'')+'>'+
      '<div class="av">'+t.name.charAt(0)+'</div>'+
      '<div class="tt"><b>'+t.name+'</b><span>'+t.sub+' · '+t.role+'</span></div>'+
      (ok?'<div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 6l6 6-6 6"/></svg></div>'
         :'<span style="font-size:11px;color:#E0453F;background:#FDECEB;padding:2px 8px;border-radius:99px">成员已停用</span>')+
      '</div>';
  });
  $('tenantList').innerHTML=h;
}
function pickTenant(i){ const t=curAcct.acct.tenants[i]; if(t.member!=='启用') return; finish(t); }
function doSetPwd(){
  clearErr('setErr');
  const np=$('np1').value, cp=$('np2').value;
  if(!validPwd(np)){ showErr('setErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np!==cp){ showErr('setErr','两次输入的密码不一致'); return; }
  curAcct.acct.pwd=np; curAcct.acct.firstLogin=false;
  toast('密码设置成功'); afterAuth();
}
function finish(tenant){
  curTenant=tenant;
  enter();
}
function enter(){ STACK=['home']; render(); }

/* 忘记密码（底部弹层） */
let codeTimer=null, codeSent=false;
function openForgot(){ $('forgotMask').classList.add('on'); clearErr('fgErr'); }
function closeForgot(){ $('forgotMask').classList.remove('on'); }
function sendCode(){
  const phone=$('fgPhone').value.trim();
  if(!/^1\d{10}$/.test(phone)){ showErr('fgErr','请输入正确的 11 位手机号'); return; }
  if(!ACCOUNTS[phone]){ showErr('fgErr','该手机号尚未开通账号，无法发送验证码'); return; }
  if(ACCOUNTS[phone].locked){ showErr('fgErr','该账号已被全局锁定，请联系管理员重置'); return; }
  codeSent=true;
  let s=60; const b=$('codeBtn'); b.disabled=true; b.textContent=s+'s 后重发';
  codeTimer=setTimeout(function tick(){ s--; if(s<=0){ b.disabled=false; b.textContent='重新获取'; clearTimeout(codeTimer);} else { b.textContent=s+'s 后重发'; codeTimer=setTimeout(tick,1000);} },1000);
  toast('验证码已发送（演示：任意 6 位）');
}
function doReset(){
  clearErr('fgErr');
  const phone=$('fgPhone').value.trim();
  const code=$('fgCode').value.trim();
  const np=$('fgPwd').value, cp=$('fgPwd2').value;
  if(!ACCOUNTS[phone]){ showErr('fgErr','该手机号尚未开通账号'); return; }
  if(!codeSent){ showErr('fgErr','请先获取短信验证码'); return; }
  if(!/^\d{6}$/.test(code)){ showErr('fgErr','请输入 6 位短信验证码'); return; }
  if(!validPwd(np)){ showErr('fgErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np!==cp){ showErr('fgErr','两次输入的密码不一致'); return; }
  ACCOUNTS[phone].pwd=np; ACCOUNTS[phone].firstLogin=false;
  closeForgot(); toast('密码重置成功，请使用新密码登录');
}

/* 修改密码（账号设置 · 底部弹层） */
function openChPwd(){
  $('chpwdMask').classList.add('on');
  $('chOld').value=''; $('chPwd').value=''; $('chPwd2').value='';
  clearErr('chErr');
}
function closeChPwd(){ $('chpwdMask').classList.remove('on'); }
function doChPwd(){
  clearErr('chErr');
  if(!curAcct||!curAcct.acct){ showErr('chErr','当前会话已失效，请重新登录'); return; }
  const old=$('chOld').value, np=$('chPwd').value, cp=$('chPwd2').value;
  if(!old){ showErr('chErr','请输入原密码'); return; }
  if(old!==curAcct.acct.pwd){ showErr('chErr','原密码输入错误，请重新输入'); return; }
  if(!validPwd(np)){ showErr('chErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np===old){ showErr('chErr','新密码不能与原密码相同'); return; }
  if(np!==cp){ showErr('chErr','两次输入的密码不一致'); return; }
  curAcct.acct.pwd=np; curAcct.acct.firstLogin=false;
  closeChPwd(); toast('密码修改成功，请使用新密码登录');
}

$('pwd').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
</script>
