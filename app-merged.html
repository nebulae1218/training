<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI陪练 · 学员端（合并版）</title>
<style>
:root{
  --primary:#1B5BF0; --primary-d:#1248C8; --p-bg:#EBF1FF; --p-bd:#C4D6FF;
  --cyan:#04C6EE; --grad:linear-gradient(135deg,#04C6EE,#175EF5);
  --bg:#F3F5FA; --surface:#FFF; --bd:#E8ECF4; --bd2:#D9DFEB;
  --t1:#1A2233; --t2:#5B6478; --t3:#939BAD;
  --ok:#12A760; --ok-bg:#E6F7EF; --warn:#E8960C; --warn-bg:#FFF5E3; --bad:#E0453F; --bad-bg:#FDECEB;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(160deg,#E9EEF8,#DDE6F5);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:0}

.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 30px 80px rgba(20,31,74,.35),0 0 0 10px #10173A,0 0 0 12px #2A3563;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#0B1020;border-radius:14px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1);z-index:62;pointer-events:none}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-r svg{display:block}
.statusbar.light{color:#fff}
.statusbar.solid{background:#fff}

.appbody{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:44px}
.page{flex:1;overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column}
.page::-webkit-scrollbar{width:0}
.page>*{flex-shrink:0}
.page>.subhead{margin:0 -16px}
.page.bleed{margin-top:-44px}

/* tabbar */
.tabbar{flex-shrink:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding:7px 6px 20px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--t3)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--primary);font-weight:600}

/* 顶栏（二级页） */
.subhead{position:sticky;top:0;z-index:30;display:flex;align-items:center;padding:8px 12px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.subhead .bk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.subhead .bk:active{background:var(--bg)}
.subhead b{position:absolute;left:0;right:0;top:8px;line-height:34px;text-align:center;font-size:16.5px;font-weight:650;pointer-events:none}
.subhead .r{position:absolute;right:12px;top:8px;height:34px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--primary);font-weight:550}
.subhead .phb{width:30px;height:30px;border-radius:50%;background:var(--p-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.subhead .phb:active{background:#dbe6ff}
.subhead .phb.txtb{font-size:13px;font-weight:650;line-height:1}

/* 首页头部 */
.home-head{margin:0 -16px;padding:64px 16px 18px;background:radial-gradient(130% 110% at 88% -25%,rgba(255,255,255,.32),transparent 55%),var(--grad);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 10px 26px rgba(23,94,245,.22)}
.home-head .row{display:flex;align-items:center;gap:10px}
.home-head .row img{height:26px}
.home-head .hello{margin-top:14px;font-size:19px;font-weight:700}
.home-head .hello span{font-size:13px;font-weight:400;opacity:.85;display:block;margin-top:2px}
.bell{margin-left:auto;position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.bell i{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:#FF4D4F;border-radius:99px;font-size:9.5px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}

/* 卡片 */
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.sec-t{display:flex;align-items:center;margin:16px 0 9px}
.sec-t b{font-size:15px;font-weight:650}
.sec-t a{margin-left:auto;font-size:12px;color:var(--t3)}
.mt{margin-top:12px}

/* 任务页大标题 */
.pg-h1{font-size:22px;font-weight:750;color:var(--t1);margin:8px 0 10px;letter-spacing:.2px}

/* 任务卡（列表版，参考稿样式） */
.tk{background:var(--surface);border-radius:16px;padding:16px 15px 13px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,31,74,.06);transition:transform .12s}
.tk:active{transform:scale(.985)}
.tk-top{display:flex;align-items:flex-start;gap:10px}
.tk-name{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.4;color:var(--t1)}
.tk-badge{flex-shrink:0;font-size:11px;font-weight:550;line-height:1;padding:5px 10px;border-radius:99px;background:#E8F0FE;color:var(--primary);white-space:nowrap}
.tk-desc{margin:8px 0 0;font-size:12.5px;line-height:1.7;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk-bar{height:6px;border-radius:3px;background:#E9EEF7;margin-top:12px;overflow:hidden}
.tk-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2F6BFF,#4E8DFF)}
.tk-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.tk-dl{font-size:11.5px;color:var(--t3)}
.tk-pct{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--primary)}
.tk-pct svg{margin-top:.5px}
.task-hero{background:linear-gradient(120deg,#175EF5,#3E8BFF);border-radius:16px;padding:15px;color:#fff;box-shadow:0 8px 20px rgba(23,94,245,.3)}
.task-hero .tag{font-size:10.5px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:99px}
.task-hero b.t{display:block;font-size:15.5px;margin:7px 0 3px}
.task-hero p{font-size:11.5px;opacity:.85}
.prog{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:3px}

/* 快捷入口 */
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.q{background:var(--surface);border-radius:14px;padding:13px 4px;text-align:center;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.q .ic{width:40px;height:40px;margin:0 auto 7px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.q b{font-size:11.5px;font-weight:600;display:block}
.ic-b{background:var(--p-bg);color:var(--primary)}
.ic-g{background:#E6F7F0;color:#0DA678}
.ic-o{background:#FFF3E4;color:#F08A0C}
.ic-p{background:#F1EDFF;color:#6E4EEA}
.ic-c{background:#E0F6FB;color:#0AA3C6}

/* 通用条目 */
.item{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:14px;padding:13px 14px;box-shadow:0 1px 3px rgba(20,31,74,.05);margin-bottom:9px}
.item .thumb{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:650}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tt span{font-size:11.5px;color:var(--t3);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{color:var(--t3);flex-shrink:0}
.bar{height:5px;background:#EDEFF5;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.bar i.g{background:var(--ok)}.bar i.w{background:var(--warn)}.bar i.d{background:var(--bad)}
.st{display:inline-flex;align-items:center;padding:1.5px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}.st.info{background:var(--p-bg);color:var(--primary)}
.st.gray{background:#EEF0F5;color:var(--t3)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-size:14.5px;font-weight:600}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(27,91,240,.3)}
.btn-p:active{background:var(--primary-d)}
.btn-g{background:#fff;border:1px solid var(--bd2);color:var(--t2)}
.btn-dis{background:#E7EAF1;color:var(--t3);box-shadow:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.chips::-webkit-scrollbar{height:0}
.chips.tight{gap:6px;padding:0;margin:0}
.chips.tight + .chips.tight{margin:6px 0 9px}
.chips.tight .chip{padding:4px 11px;font-size:11.5px}
.chips.tight .chip.on{font-weight:600}
.chip{flex-shrink:0;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--bd);font-size:12.5px;color:var(--t2)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:9px 13px;margin-bottom:11px;color:var(--t3);font-size:13px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:none}

/* 剧本详情 */
.cover{margin:0 -16px;padding:20px 16px 18px;background:radial-gradient(130% 110% at 88% -25%,rgba(255,255,255,.32),transparent 55%),var(--grad);color:#fff}
.cover h1{font-size:19px;font-weight:700;margin-bottom:6px}
.cover p{font-size:12.5px;opacity:.88;line-height:1.6}
.pill{display:inline-block;font-size:11px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;margin-right:6px;margin-top:8px}
.persona-pick{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.pp{flex:0 0 68px;border:1.5px solid var(--bd);border-radius:13px;padding:10px 4px;text-align:center;cursor:pointer}
.pp.on{border-color:var(--primary);background:#F6F9FF}
.pp .av{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:650;font-size:13.5px}
.pp b{font-size:12px;display:block;white-space:nowrap}
.pp span{font-size:10px;color:var(--t3);white-space:nowrap}
.pp-add{flex:0 0 68px;border:1.5px dashed #C7D2E8;border-radius:13px;padding:10px 4px;text-align:center;color:var(--primary);cursor:pointer;background:#F8FAFF}
.pp-add .av{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:#E3EDFF;color:var(--primary)}
.pp-add b{font-size:12px;display:block;white-space:nowrap}
.pp-add span{font-size:10px;color:var(--t3);white-space:nowrap}
/* 自定义客户表单 */
.f-lab{display:block;font-size:12px;color:var(--t2);font-weight:600;margin:13px 0 0}
.f-lab:first-child{margin-top:0}
.f-in{width:100%;border:1px solid var(--bd2);border-radius:11px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;margin-top:6px}
.f-in:focus{border-color:var(--primary)}
.f-cnt{font-size:10.5px;color:var(--t3);margin-top:4px}
.info-kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.info-kv:last-child{border:none}
.info-kv span{color:var(--t3)}
.info-kv b{font-weight:600}

/* 陪练执行 */
.chatpage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#EAF2FF 0%,#F3F5FA 30%)}
.chat-head{flex-shrink:0;background:#fff;border-bottom:1px solid var(--bd);padding:8px 16px 10px;display:flex;align-items:center;gap:9px}
.chat-head .end{margin-left:auto;color:var(--bad);font-size:13px;font-weight:600}
.timer{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;background:var(--bg);padding:3px 9px;border-radius:99px}
.chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;max-width:85%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.mav{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:650;overflow:hidden}
.mav.ai{background:#fff;box-shadow:0 2px 6px rgba(23,94,245,.18)}
.mav.ai img{width:100%;height:100%;object-fit:contain}
.mav.self{background:linear-gradient(135deg,#12A760,#3FC98A)}
.bub{background:#fff;border-radius:3px 14px 14px 14px;padding:10px 13px;font-size:13.5px;line-height:1.65;box-shadow:0 1px 3px rgba(20,31,74,.06)}
.msg.me .bub{background:var(--primary);color:#fff;border-radius:14px 3px 14px 14px}
/* 文字对话页：气泡操作条（推荐话术/评分/优化） */
.crow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ccb{font-size:11px;padding:3.5px 10px;border-radius:99px;background:#fff;border:1px solid var(--bd);color:var(--t2)}
.ccb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cextra{margin-top:6px;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.7;background:#F2F6FD;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.cextra b{display:block;margin-bottom:2px;font-size:11px;color:var(--primary)}
.cextra .mut{color:var(--t3)}
/* 剧本列表：头部 + 卡片 + toast */
.s-head{display:flex;gap:9px;align-items:center}
.search.s-short{flex:1;margin-bottom:0;padding:8px 12px}
.crt{flex-shrink:0;height:29px;padding:0 10px;border-radius:9px;background:var(--primary);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;box-shadow:0 3px 9px rgba(27,91,240,.24)}
.crt:active{background:var(--primary-d)}
.sc{background:var(--surface);border-radius:16px;padding:14px 14px 11px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,31,74,.06);transition:transform .12s}
.sc:active{transform:scale(.985)}
.sc-top{display:flex;align-items:flex-start;gap:12px}
.sc-thumb{width:50px;height:50px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(20,31,74,.16)}
.sc-tt{flex:1;min-width:0}
.sc-tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:650;line-height:1.45}
.sc-tt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11.5px;color:var(--t3);margin-top:3px;line-height:1.6;overflow:hidden}
.sc-go{width:26px;height:26px;border-radius:50%;background:#F2F5FA;color:var(--t3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.sc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.sc-tags i{font-style:normal;font-size:10.5px;line-height:1.7;padding:1px 9px;border-radius:99px;background:#EEF2F9;color:var(--t2);white-space:nowrap;font-weight:500}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px dashed #E8ECF4;font-size:11px}
.sc-cnt{color:var(--primary);font-weight:550}
.sc-role{color:var(--t3)}

/* ===== 快速创建（AI 生成剧本 / 客户）===== */
.seg{display:flex;background:#EDF1F8;border-radius:12px;padding:3px;margin:12px 0 0}
.seg-i{flex:1;text-align:center;font-size:12.5px;color:var(--t2);padding:8px 0;border-radius:9px;font-weight:550;display:flex;align-items:center;justify-content:center;gap:4px}
.seg-i.on{background:#fff;color:var(--primary);font-weight:650;box-shadow:0 1px 4px rgba(20,31,74,.1)}
.crt-card{background:#fff;border-radius:15px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.ai-lead{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650}
.ai-lead em{font-style:normal;font-size:10px;font-weight:600;color:var(--primary);background:var(--p-bg);border:1px solid var(--p-bd);padding:1px 6px;border-radius:99px}
.ai-ta{width:100%;border:1px solid var(--bd2);border-radius:12px;padding:11px 12px;font-size:13px;font-family:inherit;line-height:1.65;outline:none;resize:none;margin-top:9px;background:#FBFCFE;color:var(--t1)}
.ai-ta:focus{border-color:var(--primary);background:#fff}
.ai-ta::placeholder{color:#AAB3C5}
.ai-hint{font-size:10.5px;color:var(--t3);margin-top:7px;line-height:1.6}
.qt{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qt b{font-size:10.5px;font-weight:500;color:var(--t2);background:#F2F5FA;border:1px solid var(--bd);border-radius:99px;padding:4px 9px}
.qt b:active{background:var(--p-bg);border-color:var(--p-bd);color:var(--primary)}
.qt b.on{background:var(--p-bg);border-color:var(--p-bd);color:var(--primary);font-weight:650}
.gen-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:44px;border-radius:13px;background:var(--grad);color:#fff;font-size:14.5px;font-weight:650;box-shadow:0 6px 16px rgba(23,94,245,.28);margin-top:12px}
.gen-btn:active{opacity:.9}
.gen-btn.dis{opacity:.55;box-shadow:none}
.gen-busy{padding:4px 2px 2px}
.gen-busy .gl{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t2);padding:7px 0}
.gen-busy .gl em{width:15px;height:15px;border-radius:50%;border:2px solid var(--p-bd);border-top-color:var(--primary);animation:spin .8s linear infinite;font-style:normal;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.sn-hero{margin-top:12px;border-radius:16px;padding:14px 15px 13px;background:radial-gradient(130% 120% at 86% -20%,rgba(255,255,255,.32),transparent 60%),var(--grad);color:#fff;box-shadow:0 10px 24px rgba(23,94,245,.22)}
.sn-hero .sh-t{font-size:10.5px;opacity:.85;display:flex;align-items:center;gap:5px}
.sn-hero h2{font-size:17px;font-weight:700;line-height:1.4;margin-top:6px}
.sn-hero .sh-p{font-size:12px;opacity:.9;line-height:1.65;margin-top:6px}
.sn-hero .sh-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sn-hero .sh-tags i{font-style:normal;font-size:10.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);padding:2.5px 8px;border-radius:99px}
.sn-hero .sh-name{width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:11px;color:#fff;font-size:15.5px;font-weight:700;font-family:inherit;padding:8px 10px;outline:none;margin-top:7px;line-height:1.4}
.sn-hero .sh-name:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
.sn-sec{background:#fff;border-radius:14px;padding:13px 14px 14px;margin-top:10px;box-shadow:0 1px 3px rgba(20,31,74,.05)}
.sn-h{display:flex;align-items:center;gap:7px}
.sn-h .sn-n{width:18px;height:18px;border-radius:6px;background:var(--p-bg);color:var(--primary);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sn-h b{font-size:13.5px;font-weight:650}
.sn-h .redo{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--t3);padding:3px 7px;border-radius:8px;background:#F5F7FB}
.sn-h .redo:active{color:var(--primary);background:var(--p-bg)}

/* 语音沉浸陪练（参考布局：全屏形象 + 气泡挂操作条 + 按住说话） */
/* 语音沉浸陪练（参考：实时通话界面——全屏形象 + 通话状态 + 四键控制） */
.vpage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;background:radial-gradient(125% 72% at 50% 2%,#2C5CB4 0%,#173572 44%,#0C1733 100%)}
/* 通话主区：全屏形象 */
.v-call{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding:2px 0 0;z-index:4}
.v-avatar{position:relative;width:248px;height:248px;margin-top:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v-avatar img{width:222px;height:222px;object-fit:contain;filter:drop-shadow(0 16px 34px rgba(0,0,0,.5));position:relative;z-index:2}
.v-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(150,220,255,.34);animation:vring 3s infinite ease-out}
.v-ring.r1{inset:6px}.v-ring.r2{inset:-14px;animation-delay:1s}.v-ring.r3{inset:-34px;animation-delay:2s}
@keyframes vring{0%{transform:scale(.86);opacity:.55}100%{transform:scale(1.16);opacity:0}}
/* 正在聆听状态胶囊 */
.v-pill{display:flex;align-items:center;gap:9px;margin-top:8px;background:rgba(4,9,22,.5);border:1px solid rgba(255,255,255,.13);border-radius:99px;padding:7px 17px;font-size:12.5px;color:#fff;flex-shrink:0}
.v-bars{display:flex;gap:3px;align-items:flex-end;height:13px;transition:opacity .3s}
.v-bars i{width:3px;background:#fff;border-radius:2px;animation:vbar 1s infinite ease-in-out}
@keyframes vbar{0%,100%{height:4px}50%{height:13px}}
/* 实时字幕 */
.v-sub{width:100%;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 14px 6px}

.vbub{max-width:92%;border-radius:16px;padding:11px 12px;font-size:13.5px;line-height:1.6}

.vbub .vrow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.vbub .vc{font-size:11px;padding:3.5px 10px;border-radius:99px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.22)}

.vspk{margin-left:auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#7FD8FF;flex-shrink:0}

.vtyping{display:flex;gap:4px;padding:13px 15px}

.vtyping i:nth-child(2){animation-delay:.2s}.vtyping i:nth-child(3){animation-delay:.4s}
/* 通话控制栏：四键等大横排 */
.v-controls{flex-shrink:0;position:relative;z-index:6;padding:6px 22px 20px}
.v-keys{display:flex;align-items:flex-start;justify-content:space-around}
/* 悬浮可拖动的设置入口 */
.v-fab{position:absolute;right:12px;bottom:104px;z-index:12;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

/* 文字输入与菜单 */

/* ===== 登录流程（合并自 app-1110-1）===== */
.step{display:none}
.step.on{display:flex;flex-direction:column;flex:1;overflow:hidden;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{position:relative;height:236px;flex-shrink:0;background:linear-gradient(180deg,#D9E9FF 0%,#EAF3FF 55%,#F7FAFF 100%);overflow:hidden}
.hero svg{position:absolute;right:6px;top:6px}
.hero .glow{position:absolute;left:-40px;top:30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%)}
.welcome{padding:6px 26px 0;flex-shrink:0}
.welcome h1{font-size:27px;font-weight:800;letter-spacing:.5px;color:#12182B}
.welcome .wsub{margin-top:9px;font-size:13px;color:#7A8399;line-height:1.6}
.lpage{flex:1;overflow-y:auto;padding:0 26px 20px;display:flex;flex-direction:column}
.lpage>*{flex-shrink:0}
.lpage.lgrow{justify-content:flex-start}
.lpage.lcenter{justify-content:center}
.st-head{flex-shrink:0;padding:26px 26px 0}
.st-head h1{font-size:23px;font-weight:800;color:#12182B}
.st-head .wsub{margin-top:8px;font-size:13px;color:#7A8399}
.back-a{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--primary);font-weight:550;margin-bottom:12px}
.field{margin-bottom:16px}
.lpill{display:flex;align-items:center;height:54px;border-radius:27px;background:#EDF2FA;border:1.5px solid transparent;padding:0 20px;transition:.15s}
.lpill:focus-within{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px var(--p-bg)}
.lpill svg{width:19px;height:19px;color:#8B94A9;flex-shrink:0}
.lpill input{flex:1;border:none;outline:none;font-size:15px;color:var(--t1);background:transparent;padding:0 12px;height:100%}
.lpill input::placeholder{color:#A6AFC1}
.lpill .eye{color:#8B94A9;cursor:pointer;padding:4px;display:flex}
.agree{display:flex;align-items:flex-start;gap:9px;margin:4px 2px 22px;font-size:12.5px;color:#7A8399;line-height:1.7;cursor:pointer;user-select:none}
.agree input{appearance:none;-webkit-appearance:none;flex-shrink:0;width:18px;height:18px;margin-top:2px;border:1.5px solid #C3CDDD;border-radius:50%;position:relative;cursor:pointer;transition:.15s;background:#fff}
.agree input:checked{border-color:transparent;background:var(--grad)}
.agree input:checked::after{content:"";position:absolute;left:5.5px;top:2.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.agree .lk{color:var(--primary);font-weight:550}
.lbtn-p{width:100%;height:54px;border-radius:27px;background:linear-gradient(135deg,#6FA9F7,#2E6BFF);color:#fff;font-size:16.5px;font-weight:650;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--sh-btn);transition:.15s}
.lbtn-p:active{background:linear-gradient(135deg,#5C97F2,#1B5BF0);box-shadow:var(--sh-btn-h);transform:scale(.985)}
.lbtn-p.dim{opacity:.45;pointer-events:none}
.demo-login-btn{margin-top:14px;width:100%;height:50px;border-radius:25px;background:#EDF2FA;color:var(--primary);font-size:15px;font-weight:600;border:1px dashed var(--primary);cursor:pointer;transition:.15s}
.demo-login-btn:active{background:#E2EAF7}
.demo-note{margin-top:8px;font-size:11.5px;color:var(--t3);text-align:center;line-height:1.5}
.err{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--bad);background:var(--bad-bg);border:1px solid #F6D2D0;border-radius:22px;padding:10px 16px;margin-bottom:16px}
.err.on{display:flex}
.err svg{width:15px;height:15px;flex-shrink:0}
.tenant{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid #E4EAF4;border-radius:18px;margin-bottom:12px;cursor:pointer;transition:.15s;background:#fff;box-shadow:0 2px 10px rgba(20,31,74,.05)}
.tenant:active{border-color:var(--primary);background:var(--p-bg)}
.tenant .av{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.tenant .tt b{display:block;font-size:14.5px}
.tenant .tt span{font-size:11.5px;color:var(--t3)}
.tenant .go{margin-left:auto;color:var(--t3)}
.tenant.disabled{opacity:.55;cursor:not-allowed;background:#F4F6FA;box-shadow:none}
.tenant.disabled:active{border-color:#E4EAF4;background:#F4F6FA}
.pwd-tip{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid #F6E2BF;border-radius:14px;padding:11px 14px;margin-bottom:18px;line-height:1.6;display:flex;gap:7px;align-items:flex-start}
.pwd-tip svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.sheet-mask{position:absolute;inset:0;background:rgba(12,18,40,.40);display:none;z-index:80;align-items:flex-end}
.sheet-mask.on{display:flex;animation:fade .2s ease}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px 22px 26px;animation:slide .25s ease}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:#D9DFEB;margin:0 auto 16px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:6px}
.sheet .ms{font-size:12.5px;color:var(--t3);margin-bottom:18px;line-height:1.6}
.sheet .modal-actions{display:flex;gap:10px;margin-top:6px}
.lbtn-g{height:54px;border-radius:27px;background:#EDF2FA;color:var(--t2);font-size:15.5px;font-weight:600;flex:1}
.lbtn-g:active{color:var(--primary)}
.code-row{display:flex;gap:10px}
.code-row .lpill{flex:1}
.code-btn{height:54px;flex-shrink:0;padding:0 16px;border:none;color:var(--primary);border-radius:27px;font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--p-bg)}
.code-btn:disabled{color:var(--t3);background:#F0F2F7}
.homebar{flex-shrink:0;height:22px;display:flex;align-items:center;justify-content:center;background:transparent}
.homebar i{width:130px;height:5px;border-radius:99px;background:#12182B;opacity:.9}


/* ===== 课程中心 / 学习页（对齐后台新建课程字段，纯课程不掺杂任务） ===== */
.course-thumb{position:relative;overflow:hidden;background:var(--grad)}
.item .thumb.course-thumb{width:60px;height:40px}
.course-cover{aspect-ratio:3/2;display:flex;flex-direction:column;justify-content:flex-end}
.course-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.course-thumb .ct-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.course-detail-cover{padding:0;background:var(--grad)}
.course-detail-cover .course-cover-img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.course-thumb .ct-badge{position:absolute;left:5px;top:5px;font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.26);border-radius:5px;padding:1px 5px}
.course-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.course-tags .ctag{font-size:10.5px;color:var(--primary);background:var(--p-bg);border-radius:99px;padding:2px 8px}
.course-meta{padding:13px 14px}
.course-meta .course-tags{margin:0 0 6px}
.course-meta .info-kv{padding:8px 0}
.course-meta .bar{margin-top:8px}
.cover .cover-tags{margin-top:9px}
.cover .cover-tags .pill{margin:0 6px 5px 0}
.cover .cover-desc{font-size:12px;opacity:.92;line-height:1.6;margin:6px 0 0}
.sec-inline{display:flex;align-items:center;justify-content:space-between}
.sec-inline small{font-size:11px;color:var(--t3)}
.chapter-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--bd);cursor:pointer}
.chapter-item:last-child{border-bottom:none}
.chapter-item .ch-ic{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--p-bg);color:var(--primary)}
.chapter-item .ch-main{flex:1;min-width:0}
.chapter-item .ch-main b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chapter-item .ch-main span{font-size:11px;color:var(--t3)}
.chapter-item .ch-st{flex-shrink:0}
.chapter-item.cur .ch-main b{color:var(--primary)}
.learn-video{height:186px;border-radius:14px;background:radial-gradient(120% 100% at 80% 0,rgba(255,255,255,.22),transparent 60%),linear-gradient(135deg,#175EF5,#04C6EE);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:8px;position:relative}
.learn-video .lv-cap{position:absolute;left:12px;bottom:10px;font-size:11px;opacity:.9}
.learn-video .lv-type{position:absolute;right:12px;top:10px;font-size:10.5px;background:rgba(0,0,0,.24);border-radius:99px;padding:2px 9px}
.learn-doc{padding:16px;font-size:13px;line-height:1.85;color:var(--t2);background:#fff;border-radius:14px}
.learn-doc p{margin:0 0 10px}
.learn-doc p:last-child{margin-bottom:0}
.learn-nav{display:flex;gap:9px;margin-top:12px}
.learn-nav .btn{flex:1;height:42px;font-size:13.5px}
.learn-nav .btn.grow2{flex:1.7}
.chapter-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.chapter-dots i{width:16px;height:5px;border-radius:3px;background:#E7EAF1;display:block}
.chapter-dots i.done{background:var(--ok)}
.chapter-dots i.cur{background:var(--primary)}

/* ===== 课程学习页 · 按内容类型细化（视频 / PPT / PDF / 图文 / 音频） ===== */
.ls-media{border-radius:14px;overflow:hidden;background:#fff}
.ls-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;background:var(--primary)}
.ls-tag.ppt{background:#E8960C}.ls-tag.pdf{background:#E0453F}.ls-tag.article{background:#12A760}.ls-tag.audio{background:#7C5CFC}
/* 视频 */
.ls-video{background:linear-gradient(135deg,#0E1B3D,#1B3A6E);color:#fff}
.ls-video-stage{height:196px;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 100% at 80% 0,rgba(255,255,255,.16),transparent 60%)}
.ls-playbig{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);color:#175EF5;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.ls-corner{position:absolute;right:12px;top:12px;font-size:10.5px;background:rgba(0,0,0,.34);border-radius:99px;padding:3px 9px}
.ls-vbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(0,0,0,.22)}
.ls-vbar .ls-pg{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.ls-vbar .ls-pg i{display:block;height:100%;background:#fff;border-radius:3px;width:0}
.ls-vbar small{font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums}
.ls-fs{position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.34);color:#fff;display:flex;align-items:center;justify-content:center}
.ls-fs-dark{right:12px;bottom:12px;background:rgba(20,31,74,.10);color:var(--t2)}
.ls-fileline{font-size:11.5px;color:var(--t3);padding:0 2px 2px}
/* PPT */
.ls-ppt{background:var(--surface-2,#F3F5FA);padding:14px}
.ls-slide{aspect-ratio:16/9;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(20,31,74,.12);padding:20px;display:flex;flex-direction:column;justify-content:center;position:relative;border:1px solid var(--bd)}
.ls-slide .ls-sno{position:absolute;right:14px;top:12px;font-size:10px;letter-spacing:1px;color:var(--t3)}
.ls-slide b{font-size:17px;color:var(--t1);line-height:1.5}
.ls-slide .ls-ul{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.ls-slide .ls-ul span{font-size:12px;color:var(--t2);padding-left:14px;position:relative}
.ls-slide .ls-ul span:before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.ls-ppt-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px}
.ls-ppt-nav button{width:34px;height:30px;border-radius:8px;border:1px solid var(--bd2);background:#fff;color:var(--t2)}
.ls-ppt-nav span{font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}
/* PDF */
.ls-pdf{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}
.ls-pdf-head{display:flex;align-items:center;gap:8px;padding-bottom:11px;border-bottom:1px solid var(--bd)}
.ls-pdf-head b{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-pdf-head small{font-size:11px;color:var(--t3)}
.ls-paper{padding:14px 2px;font-size:12.5px;line-height:1.9;color:var(--t2)}
.ls-paper h4{font-size:14px;color:var(--t1);margin-bottom:9px}
.ls-paper p{margin-bottom:8px}
.ls-pdf-foot{text-align:center;font-size:11px;color:var(--t3);padding-top:10px;border-top:1px dashed var(--bd)}
/* 图文 */
/* 音频 */
.ls-audio{background:linear-gradient(135deg,#3B2A7A,#7C5CFC);border-radius:14px;padding:16px;color:#fff}
.ls-audio-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ls-audio-ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.ls-audio-head b{font-size:13.5px;display:block}
.ls-audio-head span{font-size:11px;opacity:.8}
.ls-wave{height:54px;display:flex;align-items:center;gap:3px;overflow:hidden}
.ls-wave i{flex:1;min-width:3px;border-radius:3px;background:rgba(255,255,255,.7);display:block}
.ls-wave i.on{background:#fff}
.ls-audio-bar{display:flex;align-items:center;gap:11px;margin-top:14px}
.ls-audio-play{width:38px;height:38px;flex:none;border-radius:50%;background:#fff;color:#7C5CFC;display:flex;align-items:center;justify-content:center}
.ls-audio-bar .ls-pg{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.ls-audio-bar .ls-pg i{display:block;height:100%;width:0;background:#fff}
.ls-audio-bar small{font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar" id="sb"><span>9:41</span><span class="sb-r">
   <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
   <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6a9.5 9.5 0 0 1 13 0"/><path d="M3.6 6.2a6 6 0 0 1 7.8 0"/><circle cx="7.5" cy="9.2" r="1.1" fill="currentColor" stroke="none"/></svg>
   <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x=".5" y=".5" width="20" height="11" rx="3" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M22.6 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" opacity=".5"/></svg>
  </span></div>
  <div id="app" class="appbody">


    <!-- 步骤1：登录（参考截图布局） -->
    <section class="step on" id="stepLogin">
      <div class="hero">
        <div class="glow"></div>
        <svg width="330" height="224" viewBox="0 0 330 224" fill="none">
          <!-- 悬浮底座 -->
          <ellipse cx="212" cy="196" rx="96" ry="20" fill="#D6E5FB"/>
          <ellipse cx="212" cy="190" rx="70" ry="14" fill="#fff"/>
          <ellipse cx="212" cy="186" rx="52" ry="10" fill="#E8F0FE"/>
          <!-- 主对话气泡（AI 教练） -->
          <g filter="url(#soft)">
            <rect x="140" y="58" width="132" height="88" rx="26" fill="#fff"/>
            <rect x="140" y="58" width="132" height="88" rx="26" fill="url(#g1)" opacity=".08"/>
            <path d="M168 146l14 18 4-18z" fill="#fff"/>
            <circle cx="176" cy="94" r="5" fill="#2E6BFF"/>
            <circle cx="200" cy="94" r="5" fill="#6FA9F7"/>
            <circle cx="224" cy="94" r="5" fill="#B9D4FB"/>
            <rect x="166" y="112" width="80" height="7" rx="3.5" fill="#E3ECFB"/>
            <rect x="166" y="124" width="56" height="7" rx="3.5" fill="#EDF2FB"/>
          </g>
          <!-- 麦克风徽章（陪练语音） -->
          <g>
            <circle cx="138" cy="70" r="26" fill="url(#g1)"/>
            <rect x="133" y="56" width="10" height="18" rx="5" fill="#fff"/>
            <path d="M127 68a11 11 0 0 0 22 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M138 79v6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- 评分徽章 -->
          <g>
            <rect x="252" y="128" width="72" height="34" rx="17" fill="#fff"/>
            <path d="M268 136l2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-3-5.4 3 1.1-6-4.5-4.3 6.1-.8z" fill="#FFB53D"/>
            <rect x="282" y="142" width="32" height="6" rx="3" fill="#E3ECFB"/>
          </g>
          <!-- 星光点缀 -->
          <path d="M108 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#9CC2F9"/>
          <path d="M296 46l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#C7DBFA"/>
          <circle cx="120" cy="120" r="4" fill="#DCE9FB"/>
          <defs>
            <linearGradient id="g1" x1="112" y1="30" x2="272" y2="160" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4E9BF5"/><stop offset="1" stop-color="#1B5BF0"/>
            </linearGradient>
            <filter id="soft" x="120" y="40" width="180" height="150" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B5BF0" flood-opacity=".12"/>
            </filter>
          </defs>
        </svg>
      </div>

      <div class="welcome">
        <h1>Hi ~ 欢迎登录</h1>
        <p class="wsub">AI陪练 · 学员端｜请使用管理员为您开通的账号登录</p>
      </div>

      <div class="lpage lgrow" style="padding-top:26px">
        <div class="err" id="loginErr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="loginErrTx"></span></div>
        <div class="field"><div class="lpill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="username"></div></div>
        <div class="field"><div class="lpill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pwd" type="password" placeholder="请输入登录密码" autocomplete="current-password"><span class="eye" id="eye" onclick="toggleEye()" title="显示/隐藏密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span></div></div>

        <label class="agree"><input type="checkbox" id="agree"><span>我已阅读并同意<span class="lk">《用户协议》</span>及<span class="lk">《隐私政策》</span></span></label>

        <button class="lbtn-p" onclick="doLogin()">登 录</button>
        <button class="demo-login-btn" onclick="demoLogin('13800001000','Admin@123')">⚡ 一键登录演示账号</button>
        <p class="demo-note">※ 一键登录仅用于原型演示快速查看，请勿在正式环境使用</p>
      </div>
    </section>

    <!-- 步骤2：选择租户 -->
    <section class="step" id="stepTenant">
      <div class="st-head">
        <span class="back-a" onclick="goStep('login')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M15 18l-6-6 6-6"/></svg>返回登录</span>
        <h1>选择要进入的企业</h1>

const app=document.getElementById('app');
function cur(){return STACK[STACK.length-1];}
function navTo(s){ if(SIM_MODE&&!SIM_OK.includes(s)){toast('实时模拟训练模式：仅可体验 剧本详情 → 对练页面 → 陪练报告 路径');return;} STACK.push(s);render(); }
function back(){ if(SIM_MODE&&STACK.length<=1){toast('已在「剧本详情」页');return;} STACK.pop();render(); }
function goTab(s){ if(SIM_MODE){toast('实时模拟训练模式：底部导航已隐藏，仅可体验陪练路径');return;} STACK=[s];render(); }
let LAST_SCREEN='',LAST_DEPTH=0;
function render(){
  const s=cur();
  /* 同一页面内重绘（如点字段选项、生成结果）保留滚动位置；切换页面才回到顶部 */
  const prevPage=app.querySelector('.page');
  const keepSt=prevPage?prevPage.scrollTop:0;
  const samePage=!!prevPage&&LAST_SCREEN===s&&LAST_DEPTH===STACK.length;
  const isRoot=STACK.length===1;
  const hideTab=SIM_MODE||(s==='practice'||s==='practiceV'||s==='reportGen'||s==='examRun'||s==='qa');
  let head='';
  if(!isRoot) head='<div class="subhead"><button class="bk" onclick="back()">'+ic('back',16)+'</button><b>'+TITLES[s]+'</b><span class="r">'+(SRIGHT[s]||'')+'</span></div>';
  const body=SCREENS[s]();
  app.innerHTML=(head?body.replace(/(<div class="(?:page|chatpage)[^"]*">)/,'$1'+head):body)+(!hideTab?TABBAR(s):'');
  if(s==='courses') courseFilter();
  app.classList.toggle('dark',false);
  const p=app.querySelector('.page'); if(p)p.scrollTop=samePage?keepSt:0;
  LAST_SCREEN=s;LAST_DEPTH=STACK.length;
  const sb=document.getElementById('sb');
  if(sb){sb.classList.toggle('light',['home','me'].indexOf(s)>=0);sb.classList.toggle('solid',!isRoot);}
  if(s==='reportGen') setTimeout(()=>{if(cur()==='reportGen')navTo('report');},3000);
  if(s==='diag') setTimeout(()=>drawRadar('dgRadar',260),40);
  if(s==='report') setTimeout(()=>drawRadar('rpRadar',300,(PRAC.result&&PRAC.result.dims)||dim6),40);
  if(s==='practice'||s==='practiceV') startTimer();
  if(s==='practice'){const c=app.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight;}
  if(s==='practiceV'){const c=app.querySelector('#vchat');if(c)c.scrollTop=c.scrollHeight;const last=VCHAT[VCHAT.length-1];vSpeaking(last&&(last.who==='ai'||last.who==='typing'));}
}

function qaAnswer(t){t=t||'';for(const e of QA_KB){if(e.k.some(k=>t.indexOf(k)>=0))return e;}return QA_FALLBACK;}
function qaScroll(){const c=document.getElementById('qachat');if(c)c.scrollTop=c.scrollHeight;}
function qaReply(txt){setTimeout(()=>{QACHAT.push({who:'typing'});render();qaScroll();
  setTimeout(()=>{QACHAT.pop();QACHAT.push(Object.assign({who:'ai'},qaAnswer(txt)));render();qaScroll();},900);},300);}

/* ---- 课程：列表 / 详情 / 学习 / 完成（仅课程，不含任务） ---- */
let COURSE_STATUS='全部', COURSE_Q='';
function courseSetStatus(v){COURSE_STATUS=v;courseFilter();}
function courseQuery(v){COURSE_Q=(v||'').trim();courseFilter();}
function courseFilter(){
  const kw=COURSE_Q.toLowerCase();
  document.querySelectorAll('#courseList .course-item').forEach(el=>{
    const done=el.dataset.done==='1';
    const stOk=COURSE_STATUS==='全部'||(COURSE_STATUS==='已完成'?done:!done);
    const ok=stOk&&(!kw||el.dataset.kw.indexOf(kw)>=0);
    el.style.display=ok?'':'none';
  });
  document.querySelectorAll('#courseCats .chip').forEach(b=>b.classList.toggle('on',b.dataset.st===COURSE_STATUS));
  const empty=document.getElementById('courseEmpty');
  if(empty)empty.style.display=[...document.querySelectorAll('#courseList .course-item')].some(e=>e.style.display!=='none')?'none':'block';
}
SCREENS.courses=()=>{
  const cats=['全部','未完成','已完成'];
  return '<div class="page">'+
   '<div style="height:12px"></div><div class="search">'+ic('doc',14)+'<input id="courseSearch" placeholder="搜索课程名称 / 标签" value="'+esc(COURSE_Q)+'" oninput="courseQuery(this.value)"></div>'+
   '<div class="chips" id="courseCats">'+cats.map(c=>'<button class="chip'+(c===COURSE_STATUS?' on':'')+'" data-st="'+c+'" onclick="courseSetStatus(\''+c+'\')">'+c+'</button>').join('')+'</div>'+
   '<div id="courseList">'+COURSES.map(c=>{
     const done=courseDoneCh(c);
     return '<div class="item course-item" data-done="'+(c.prog===100?'1':'0')+'" data-kw="'+esc((c.name+' '+c.cate+' '+c.tags.join(' ')).toLowerCase())+'" onclick="SET_COURSE('+c.id+');navTo(\'courseDetail\')">'+
      '<div class="thumb course-thumb"><img class="course-cover-img" src="'+courseCoverSrc(c)+'" alt="课程封面"><span class="ct-play">'+ic('play',16)+'</span><span class="ct-badge">'+c.ch+' 章</span></div>'+
      '<div class="tt"><b>'+esc(c.name)+'</b><span>'+esc(c.cate)+' · '+courseTotalMin(c)+' 分钟 · '+c.chapters.length+' 章</span>'+
       '<div class="course-tags">'+c.tags.map(t=>'<span class="ctag">'+esc(t)+'</span>').join('')+'</div>'+
       '<div style="display:flex;gap:8px;align-items:center;margin-top:7px"><div class="bar" style="flex:1"><i class="'+(c.prog===100?'g':c.prog>0&&c.prog<50?'w':'')+'" style="width:'+c.prog+'%"></i></div><span style="font-size:11px;color:var(--t3)">'+c.prog+'%</span></div></div></div>';
   }).join('')+'</div>'+
   '<div class="note" id="courseEmpty" style="margin-top:4px;display:none">没有符合条件的课程，试试更换筛选或关键词。</div></div>';
};

let COURSE=1, LEARN_CH=0;
function SET_COURSE(i){COURSE=i;}
function openLearn(idx){
  const c=COURSES[COURSE];
  LEARN_CH=(typeof idx==='number')?idx:Math.min(courseDoneCh(c),c.chapters.length-1);
  navTo('learn');
}
/* 学习页内切换章节：同页重绘，不新增导航层级（保持 列表→详情→学习 三级） */
function switchChapter(idx){
  const c=COURSES[COURSE];
  LEARN_CH=Math.max(0,Math.min(idx,c.chapters.length-1));
  render();
}

 return '<div class="page"><div class="cover course-detail-cover">'+

 '</div>';};

function pnBuild(){
  const t=PN.prompt||'';
  const sex=pnSexOf(t)||rand(['男','女']);
  const age=pnAgeOf(t)||rand(P_AGES.filter(a=>a!=='未知'));
  const job=pnJobOf(t)||rand(P_JOBS.filter(j=>j!=='未知'));
  const fam=pnFamOf(t)||rand(['单身','已婚无孩','已婚有孩','三代同堂']);
  const style=pnStyleOf(t)||rand(P_STYLES);
  const tags=pnTagsOf(t);
  const vg=sex==='女'?'女声':'男声';
  const famTxt=(fam&&fam!=='未知')?' \u00b7 '+fam:'';
  return {name:rand(SURNAMES)+(sex==='女'?'女士':'先生'),sex:sex,age:age,job:job,fam:fam,tags:tags,
    style:style,vg:vg,vt:rand(P_VT),speed:rand(P_SPEEDS),tone:rand(P_TONES),
    desc:(tags.length?tags.join('、'):style)+' \u00b7 '+age+famTxt};
}

function genPickIndustry(cfg){
  let best=GEN_INDUSTRIES[GEN_INDUSTRIES.length-1],score=0;
  GEN_INDUSTRIES.forEach(ind=>{

}

function refPickChain(goal,used){
  const g=goal||'';
  const scored=[...REF_CHAINS].sort(()=>Math.random()-.5).map(c=>{
    const hit=(c.kw||'').split(/\s+/).reduce((n,k)=>n+(k&&g.indexOf(k)>=0?1:0),0);
    return {c:c,hit:hit};
  }).sort((x,y)=>y.hit-x.hit);
  return (scored.find(s=>used.indexOf(s.c.seq[0].q)<0)||scored[0]).c;
}
/* 由场景设定生成完整对话流程：行业开场 + 随机考验环节 + 收尾推进，逐阶段附带参考话术 Q&A */
function snGenFlow(scene){
  const cfg=sceneCtx((scene||'').trim());
  const ind=genPickIndustry(cfg);
  const count=5+Math.floor(Math.random()*6);
  const midIdx=[...GEN_MID.keys()].sort(()=>Math.random()-.5).slice(0,Math.max(0,count-3)).sort((a,b)=>a-b);
  const stages=[].concat(ind.open,midIdx.map(i=>GEN_MID[i]),ind.close);
  const used=[];
  const flow=stages.map(s=>{
    /* 上下文 = 阶段名称 + 客户目标；优先选用尚未出现过的客户话术 Q，避免多阶段重复 */
    const chain=refPickChain(s.name+' '+s.goal,used);
    const fresh=chain.seq.filter(x=>used.indexOf(x.q)<0);
    const pool=fresh.length?fresh:chain.seq;
    const r=pool[Math.floor(Math.random()*pool.length)];
    used.push(r.q);
    return {name:s.name,w:0,goal:s.goal,limit:s.limit,
      pts:s.pts.split('\n').filter(Boolean).map((l,i)=>(i+1)+'. '+l.trim()).join('\n'),
      q:r.q,a:((r.a&&r.a[0])||'').trim()};
  });
  const n=flow.length,w=Math.floor(100/n);
  flow.forEach((f,i)=>{f.w=(i===n-1)?100-w*(n-1):w;});
  return flow;
}

/* ---- 剧本：状态与动作 ----
   AI 生成页依据「剧本场景设定」推测生成：剧本名称 / 对话流程 / 流程阶段参考话术 / 能力雷达；
   谁先开口 app 端默认「客户先开口」；训练难度字段已去掉；陪练客户 = 后台创建 + 当前账号自建 */
let SN={mode:'ai',scene:'',cust:0,ver:0,busy:false,draft:null,mname:'',mtype:'情景对话',roles:['全部角色'],mfirst:'客户先开口',mscene:'',mflow:[],tags:[]};
function snOpen(){SN={mode:'ai',scene:'',cust:0,ver:0,busy:false,draft:null,mname:'',mtype:'情景对话',roles:['全部角色'],mfirst:'客户先开口',mscene:'',mflow:[],tags:[]};snPickTags();navTo('scriptNew');}
/* 场景设定标签随机展示 4 个，刷新换一批 */
function snPickTags(){const idx=SCENE_LIST.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}SN.tags=idx.slice(0,4);}
function snTagRefresh(){snPickTags();render();toast('已换一批场景');}
snPickTags();
function snMode(m){SN.mode=m;render();}
/* 陪练客户池：后台创建（已发布）+ 当前账号自建的模拟客户 */
function snPool(){return PERSONA_POOL.concat(CUSTOM_P);}
function snCustName(i){const c=snPool()[i]||PERSONA_POOL[0];return c.name+' \u00b7 '+c.role;}
function snCust(i){SN.cust=i;render();}
function snPick(prompt,ver){
  const p=(prompt||'').toLowerCase();
  const sc=S_TPL.map((t,i)=>({i:i,hit:t.k.reduce((n,k)=>n+(p.indexOf(k)>=0?1:0),0)}));
  sc.sort((a,b)=>b.hit-a.hit||a.i-b.i);
  if(!sc[0].hit)return S_TPL.length-1;
  return sc[(ver||0)%sc.length].i;
}
/* 从场景设定中提取【场景】名，作为 AI 生成的剧本名称依据 */
function snSceneName(scene){
  const m=(scene.match(/【场景】(.*)/)||[])[1];
  return ((m||scene).trim()).slice(0,20);
}
function snBuild(){
  const scene=(SN.scene||'').trim();
  const key=snSceneName(scene);
  const tpl=sceneFindTpl(key);
  const t=S_TPL[snPick(scene,SN.ver)];
  const flow=snGenFlow(scene);
  const rd=radarMatchFor(scene);
  /* 剧本名称由 AI 依据场景设定自动生成，符合后台填写规范（≤50 字） */
  const ind=genPickIndustry(sceneCtx(scene));
  const name=(tpl?tpl.name:(/【场景】/.test(scene)?key:ind.label+'·专项陪练')).slice(0,50);
  return {name:name,
    desc:tpl?('针对「'+tpl.name+'」场景生成的陪练剧本：'+tpl.target+'。'):('按你的场景设定生成的通用陪练剧本，覆盖需求沟通、异议应对与推进收口。'),
    goal:tpl?tpl.target:'完成本场景下的客户接待与需求沟通，推进到明确的下一步动作',
    scene:scene,first:SN.mfirst||'客户先开口',diff:'进阶',
    time:Math.round(flow.length*4.5)+' 分钟',radar:rd.name,
    cust:[snCustName(SN.cust)],
    flow:flow,dims:rd.dims,mats:t.mats.map(m=>m.slice()),userName:false};
}
function snGen(){
  if(SN.busy)return;
  if(!(SN.scene||'').trim()){snAsk('提示','请先点击上方场景设定标签一键生成，或直接填写剧本场景设定后再生成剧本。',null,true);return;}
  SN.busy=true;render();
  setTimeout(()=>{SN.draft=snBuild();SN.busy=false;navTo('scriptNewResult');},1150);
}
function snRefresh(){
  const old=SN.draft;SN.ver++;
  const n=snBuild();
  if(old&&old.userName){n.name=old.name;n.userName=true;}
  SN.draft=n;render();toast('已重新生成一版');
}
function snName(v){if(SN.draft){SN.draft.name=v;SN.draft.userName=true;}}
function snNextCust(){const n=snPool().length;SN.cust=(SN.cust+1)%n;
  if(SN.draft)SN.draft.cust=[snCustName(SN.cust)];render();}
function snDelMat(n){if(!SN.draft)return;SN.draft.mats=SN.draft.mats.filter(m=>m[0]!==n);render();toast('已移除该素材');}
/* AI 生成页：点击预置场景标签生成场景设定（与后台一致，已有内容时确认覆盖） */
function snSceneGen(name){
  const tpl=sceneFindTpl(name);if(!tpl)return;
  const doGen=()=>{SN.scene=sceneCfgText(tpl,'销售顾问');render();toast('已按预置场景「'+name+'」生成剧本场景设定');};
  if((SN.scene||'').trim())snAsk('覆盖确认','当前剧本场景设定已有内容，切换到预置场景「'+name+'」将覆盖现有内容。是否覆盖？',doGen);
  else doGen();
}
/* 轻量确认弹层（app 底部弹窗样式） */
let SN_ASK_OK=null;
function snAsk(title,msg,okFn,okOnly){
  SN_ASK_OK=okFn||null;
  let m=document.getElementById('snAskMask');
  if(!m){
    m=document.createElement('div');m.className='sheet-mask';m.id='snAskMask';m.style.position='fixed';
    m.innerHTML='<div class="sheet"><div class="grab"></div><h3 id="snAskT" style="font-size:17px"></h3><p class="ms" id="snAskM"></p>'+
      '<div class="modal-actions">'+(okOnly?'':'<button class="lbtn-g" onclick="snAskClose(false)">取消</button>')+
      '<button class="lbtn-p" style="flex:1" onclick="snAskClose(true)">确认</button></div></div>';
    document.body.appendChild(m);
  }
  document.getElementById('snAskT').textContent=title;
  document.getElementById('snAskM').textContent=msg;
  m.classList.add('on');
}
function snAskClose(ok){
  const m=document.getElementById('snAskMask');if(m)m.classList.remove('on');
  if(ok&&SN_ASK_OK){const f=SN_ASK_OK;SN_ASK_OK=null;f();}
  else SN_ASK_OK=null;
}
function snSave(){
  const d=SN.draft;if(!d)return;
  const name=(d.name||'').trim();
  if(!name){toast('剧本名称不能为空');return;}
  const id=SCRIPTS.length;
  SCRIPTS.push({id:id,name:name,type:d.type||'情景对话',time:d.time,diff:d.diff,

/* 手动填写：对练角色（多选，含「全部角色」）/ 场景配置预置 / 对话流程阶段 */
const SN_TYPES=['情景对话','朗读','背诵','演讲','产品讲解'];
const SN_ROLES=['销售顾问','客服','售后'];
function snRoleTgl(r){
  let cur=SN.roles.indexOf('全部角色')>=0?SN_ROLES.slice():SN.roles.slice();
  if(r==='全部角色'){SN.roles=cur.length===SN_ROLES.length?['销售顾问']:['全部角色'];}
  else{
    const i=cur.indexOf(r);
    if(i>=0)cur.splice(i,1);else cur.push(r);
    SN.roles=cur.length===SN_ROLES.length?['全部角色']:(cur.length?cur:['全部角色']);
  }
  render();
}
/* 手动填写：点击预置场景标签生成场景配置（与后台一致，已有内容时确认覆盖） */
function snMScene(name){
  const tpl=sceneFindTpl(name);if(!tpl)return;
  const roles=SN.roles.indexOf('全部角色')>=0?SN_ROLES.slice():SN.roles.slice();
  const role=roles.join('、')||'销售顾问';
  const doGen=()=>{SN.mscene=sceneCfgText(tpl,role);render();toast('已按预置场景「'+name+'」生成剧本场景配置');};
  if((SN.mscene||'').trim())snAsk('覆盖确认','当前剧本场景配置已有内容，切换到预置场景「'+name+'」将覆盖现有内容。是否覆盖？',doGen);
  else doGen();
}
/* 手动填写：对话流程「AI 生成」——依据剧本场景配置生成阶段 + 参考话术（调用后台能力），生成后可修改，不支持手动新增 */
function snMFlowGen(){
  const scene=(SN.mscene||'').trim();
  if(!scene){snAsk('提示','请先在上方「剧本场景配置」中点击预置场景生成，或直接填写内容后，再生成对话流程。',null,true);return;}
  SN.mflow=snGenFlow(scene);
  render();
  toast('AI 已依据剧本场景配置生成 '+SN.mflow.length+' 个阶段与参考话术');
}
function snMFlowDel(i){SN.mflow.splice(i,1);render();}
function snMFlowSet(i,k,v){if(SN.mflow[i])SN.mflow[i][k]=v;}
function snCreateManual(){
  const ne=document.getElementById('snMN'), se=document.getElementById('snMS');
  const nm=(((ne?ne.value:SN.mname)||'').trim()).slice(0,50);
  if(!nm){toast('先填个剧本名称');return;}
  SN.mname=nm;
  const scene=((se?se.value:SN.mscene)||'').trim();
  SN.mscene=scene;
  const t=S_TPL[snPick(scene||nm,0)];
  const c=snPool()[SN.cust]||PERSONA_POOL[0];
  const roles=SN.roles.indexOf('全部角色')>=0?SN_ROLES.slice():SN.roles.slice();
  /* 对话流程由「AI 生成」产出；生成后可修改内容；未生成时按场景配置自动调用一次 */
  const stages=SN.mflow.filter(f=>((f.name||'').trim()||(f.q||'').trim()));
  let flow;
  if(stages.length){
    flow=stages.map((f,idx)=>({
      name:(f.name||'').trim()||('阶段 '+(idx+1)),w:0,
      goal:(f.goal||'').trim()||'完成本阶段沟通目标',limit:(f.limit||'').trim()||'',
      pts:(f.pts||'').trim(),q:(f.q||'').trim(),a:(f.a||'').trim()}));
    const n=flow.length,w=Math.floor(100/n);
    flow.forEach((f,i)=>{f.w=(i===n-1)?100-w*(n-1):w;});
  }else{
    flow=scene?snGenFlow(scene):t.flow.map(f=>JSON.parse(JSON.stringify(f)));
  }
  const rd=radarMatchFor(scene||nm);
  SN.draft={name:nm,desc:t.desc,goal:t.goal,scene:scene||t.scene,
    first:SN.mfirst||'客户先开口',diff:'进阶',time:t.time,radar:rd.name,
    type:SN.mtype||'情景对话',roles:roles.join('、'),
    cust:[c.name+' \u00b7 '+c.role],flow:flow,
    dims:rd.dims,mats:t.mats.map(m=>m.slice()),userName:true};
  snSave();
}

/* ================= 陪练对话引擎（剧本配置驱动） =================
   客户话术 ← 剧本对话流程 flow（阶段 · 客户目标 · 参考话术）+ 客户画像 persona（风格 / 标签 / 关注点 / 语音设置）
   谁先开口 ← 剧本 first 配置；阶段流转 ← 学员回应是否命中本阶段客户目标与评价要点
   评分与复盘 ← 阶段评价要点 pts + 参考话术 a + 企业知识库 QA_KB + 剧本能力维度 dims / 素材 mats */
function pracS(){return SCRIPTS[PRAC.scriptId]||SCRIPTS[0];}
function pracP(){return personaFull(pracS(),PRAC.persona);}
function cfgOf(s){s=s||pracS();return ((s.scene||'')+' '+(s.desc||'')+' '+(s.goal||'')).trim();}
function flowOf(s){s=s||pracS();
  if(s.flow&&s.flow.length)return s.flow;
  const tpl=S_TPL[snPick(cfgOf(s),0)];

/* ---- 客户语气：客户风格标签与语调共同决定措辞（客户配置直接进入话术） ---- */
const STYLE_VOICE={
 '价格敏感型':{tail:['，价格您先给我个实在数','，别绕，直接说多少钱','，总价还能再压一压吗']},

 '理性分析型':{tail:['，有数据我更好判断','，你按三年总账给我算算','，参数和报价单一起给我']},
 '强势主导型':{tail:['，您直接给结论','，别讲那么多','，就说能不能办'],strip:1},

const TONE_VOICE={'严肃':{strip:1},'温和':{pre:'麻烦问一下，'},'活泼':{pre:'诶，'},'平稳':{}};
function addTail(t,tail){const m=t.match(/[？?。！!…，,]*$/)[0]||'',base=t.slice(0,t.length-m.length);
  if(/[？?]$/.test(m))return base+m+tail.replace(/^，/,'')+'。';
  return base+tail+m;}
function stripHedge(t){return t.replace(/[吧呢啊呀哈嘛]/g,'');}
function styleWrap(q,p,opt){opt=opt||{};q=(q||'').trim();if(!q)return '';
  if(/^（.*）$/.test(q))return q;
  const st=STYLE_VOICE[p.style]||{},tn=TONE_VOICE[p.tone]||{};
  let t=q;
  if(st.strip||tn.strip)t=stripHedge(t);
  const idx=PRAC.stage||0;
  if(st.short)t=t.split(/[，,。]/)[0];
  if(opt.first){
    if(tn.pre||st.pre)t=(tn.pre||st.pre)+t;
    if(p.focus){const fc=p.focus.replace(/^关注/,'').replace(/[。；;]$/,'');
      t=/[？?]$/.test(t)?t+'我最关心的是'+fc+'。':addTail(t,'，我最关心的是'+fc);}
  }else{
    if(idx%3===0&&(tn.pre||st.pre))t=(tn.pre||st.pre)+t;
    const tl=Array.isArray(st.tail)?st.tail[idx%st.tail.length]:st.tail;
    if(tl)t=addTail(t,tl);

function voiceLabel(p){return [p.voice||'默认音色',(p.speed||'正常')+'语速',(p.tone||'平稳')+'语调'].join(' · ');}

/* ---- 语义匹配（演示环境轻量规则；生产环境由大模型判定） ---- */
function kwOf(t){const out=[];(t||'').replace(/[^\u4e00-\u9fa5A-Za-z0-9]+/g,' ').split(/\s+/).forEach(seg=>{
  for(let n=4;n>=2;n--)for(let i=0;i+n<=seg.length;i++){const w=seg.substr(i,n);if(out.indexOf(w)<0)out.push(w);}});return out;}
function overlap(a,b){const A=kwOf(a),B=kwOf(b);let n=0;A.forEach(w=>{if(w.length>=2&&B.indexOf(w)>=0)n++;});return n;}
const RISK=/保证最低价|保证能批|一定能批|包您|返现|私下|额外优惠|绝对没问题/;
function kbHit(t){for(const e of QA_KB){if(e.k.some(k=>t.indexOf(k)>=0))return e;}return null;}
function avgCrit(d){const k=Object.keys(d);return k.reduce((n,x)=>n+d[x],0)/k.length;}
function stageCrit(txt,st){
  const t=txt||'';
  const hitA=overlap(t,st.a||''),hitP=overlap(t,(st.pts||'')+' '+(st.goal||'')+' '+(st.limit||''));
  const q=/[？?]|吗|多少|哪|怎么|方便|平时|一般|主要|要不要/.test(t)?1:0;
  const v=/[0-9零一二三四五六七八九十]+(万|元|块|%|公里|年|次|天|个)?|对比|差价|总账|成本|权益|质保|贴息|保养|电费|参数|数据|配置|方案/.test(t)?1:0;
  const o=/理解|明白|认同|确实|您说得|不过|同时|我帮您|我给您|换个角度/.test(t)?1:0;
  const c=/约|到店|试驾|微信|发您|名额|今天|明天|周末|下一步|安排|定下来|签|留个/.test(t)?1:0;
  const kb=kbHit(t),risk=RISK.test(t),len=t.length;
  const clarity=len>=12&&len<=90?1:(len>90?0.5:(len>5?0.6:0.2));
  const s10=x=>Math.max(0,Math.min(10,Math.round((3.2+2.4*x)*10)/10));
  const d={
    '需求挖掘':s10(q*0.9+hitP*0.4+(/您|平时|通勤|家里|用途|考虑/.test(t)?0.4:0)),
    '价值传递':s10(v*0.9+hitA*0.6+(kb?0.6:0)),
    '产品介绍':s10(v*0.7+hitA*0.9+(kb?0.5:0)),
    '异议处理':s10(o*0.9+hitA*0.5+(/贵|便宜|担心|竞品|不划算|再想想/.test(t)?0.4:0)),
    '促成邀约':s10(c*0.9+clarity*0.7),
    '沟通表达':s10(clarity*0.8+(hitA?0.7:0)+(len>6?0.3:0)),
    '合规意识':risk?3:8.5};
  return {sc:Math.round(avgCrit(d)*10)/10,d:d,hit:(hitA+hitP>=2)||(hitA+q+v>=2),kb:kb,risk:risk,
    q:q,v:v,o:o,c:c,clarity:clarity,hitA:hitA,hitP:hitP,len:len};
}
function critLine(e){return '挖需 '+Math.round(e.d['需求挖掘'])+' · 价值 '+Math.round(e.d['价值传递'])+' · 异议 '+Math.round(e.d['异议处理'])+' · 促成 '+Math.round(e.d['促成邀约'])+' · 表达 '+Math.round(e.d['沟通表达']);}
function noteOf(e,st){
  if(e.risk)return '出现「保证 / 返现」类超权限承诺，按合规红线扣分；改成「我帮您申请，具体以审批为准」。';
  if(!e.hit)return '没有正面回应客户本轮关注点（'+(st.goal||'客户诉求')+'），客户会重复追问——先把问题答实，再扩展卖点。';
  const l=[];

function refLabel(a){return /^(说明|介绍|强调|表示|如实|给出|聚焦|先|把|在|保持|用|逐条|结合|确认|请|记录|复述|推荐|邀请|提议|列出|测算|提供|告知|询问|引导|观察|避免)/.test((a||'').trim())?'参考要点':'推荐话术';}

    ['表示理解','我理解您的顾虑，'],['如实','我如实跟您说：'],['给出','我给您个方案：'],

function pRecEnd(){if(!PREC)return;PREC=false;clearInterval(PRECIV);PRECIV=null;
  if(PRECSEC<1){toast('说话时间太短，请按住再试');return;}
  if(PRAC.done){toast('本场目标已达成，可点击「结束」生成报告');return;}
  PRAC.mode='语音';PMODE='voice';
  CHAT.push(meMsg(learnLine(),true,PRECSEC));render();aiReply();}
function pushMsg(){
  const inp=document.getElementById('pInput');
  const txt=(inp&&inp.value.trim())||'';
  if(!txt){toast('请先输入你的回应');if(inp)inp.focus();return;}
  if(PRAC.done){toast('本场目标已达成，可点击「结束」生成报告');return;}
  inp.value='';PRAC.mode='文字';
  CHAT.push(meMsg(txt));render();aiReply();
}

function vTgl(i,k){const m=VCHAT[i];if(!m.show)m.show={};m.show[k]=!m.show[k];render();}
function vPlay(el){el.style.color='#FFD76A';setTimeout(()=>{el.style.color='';},900);}
function vSay(t){document.getElementById('vplus').style.display='none';vSend(t);}
function vSend(txt){
  if(PRAC.done){toast('本场目标已达成，可结束并生成报告');return;}
  txt=(txt||'').trim()||learnLine();
  VCHAT.push(meMsg(txt));render();aiReply();
}
function vPlusHtml(){
  const st=stNow(),f=flowOf(),items=[];
  if(st.a){
    const ref=speakable(st.a);
    items.push(['按剧本参考话术说',ref]);
    items.push(['更短的一句',ref.split(/[，,。]/)[0]+'。']);
  }else items.push(['按阶段目标开口',st.goal||'先问清客户最在意什么']);
  return '<div class="pt">常用话术 · 来自「'+(st.name||'本阶段')+'」参考话术</div>'+
    items.map(it=>'<button onclick="vSay(\''+it[1].replace(/['"「」]/g,'')+'\')">'+it[0]+'</button>').join('');
}
function vHintHtml(){
  const st=stNow(),f=flowOf();
  return '<b>当前阶段 '+(stIdx()+1)+'/'+f.length+'：'+(st.name||'')+'</b>目标：'+(st.goal||'')+'；避免：'+(st.limit||'')+
    '<br>评价要点：'+((st.pts||'').replace(/\n/g,'；')||'—')+'<br>客户语气：'+voiceLabel(pracP());
}
function backToText(){VMODE='语音';vTxtOpen=false;PRAC.mode='文字';PMODE='text';PRAC.sess='text';CHAT=(VCHAT||[]).filter(m=>m.who!=='typing');back();}
function vMore(){const m=document.getElementById('vmenu'),p=document.getElementById('vplus'),h=document.getElementById('vhint');if(!m)return;p.style.display='none';h.style.display='none';m.style.display=m.style.display==='block'?'none':'block';}
let FAB={x:null,y:null,ox:0,oy:0,sx:0,sy:0,moved:false,drag:false};
function vFabDown(e){const el=document.getElementById('vfab');if(!el)return;
  const r=el.getBoundingClientRect();
  FAB.drag=true;FAB.moved=false;FAB.ox=e.clientX-r.left;FAB.oy=e.clientY-r.top;FAB.sx=e.clientX;FAB.sy=e.clientY;
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();}
function vFabMove(e){if(!FAB.drag)return;const el=document.getElementById('vfab');if(!el)return;
  if(!FAB.moved&&(Math.abs(e.clientX-FAB.sx)>4||Math.abs(e.clientY-FAB.sy)>4))FAB.moved=true;
  if(!FAB.moved)return;
  const p=el.parentElement.getBoundingClientRect();
  let x=e.clientX-FAB.ox-p.left,y=e.clientY-FAB.oy-p.top;
  x=Math.max(4,Math.min(p.width-el.offsetWidth-4,x));
  y=Math.max(4,Math.min(p.height-el.offsetHeight-4,y));
  FAB.x=Math.round(x);FAB.y=Math.round(y);
  el.style.left=x+'px';el.style.top=y+'px';el.style.right='auto';el.style.bottom='auto';
  e.preventDefault();}
function vFabUp(e){if(!FAB.drag)return;FAB.drag=false;const el=document.getElementById('vfab');
  if(el&&el.hasPointerCapture&&el.hasPointerCapture(e.pointerId)){try{el.releasePointerCapture(e.pointerId);}catch(_){}}
  if(!FAB.moved)vMore();}
function vFabCancel(){FAB.drag=false;}

function vHint(){document.getElementById('vmenu').style.display='none';document.getElementById('vplus').style.display='none';const h=document.getElementById('vhint');h.style.display=h.style.display==='block'?'none':'block';}
function vToggle(name){const el=document.getElementById(name==='Mute'?'vkMute':'vkSpk');if(el)el.classList.toggle('on');}
function vSpeaking(on){const b=document.getElementById('vbars');if(b)b.style.opacity=on?'1':'.35';const st=document.getElementById('vstatus');if(st)st.textContent=on?'对方说话中…':'正在聆听';}
function vPlusOpen(){const m=document.getElementById('vmenu'),p=document.getElementById('vplus'),h=document.getElementById('vhint');if(m)m.style.display='none';if(h)h.style.display='none';if(p)p.style.display='block';}

function analyze(){
  const s=pracS(),f=flowOf(s),D=dimsOf(s),M=matsOf(s),ev=(PRAC.ev||[]).slice();
  const dims=D.map(d=>{
    const ck=DIM_CRIT[d[0]]||'';
    const vals=ev.map(e=>(ck&&e.d[ck]!=null)?e.d[ck]:avgCrit(e.d));
    const crit=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    return [d[0],vals.length?Math.max(35,Math.min(100,Math.round(45+crit*5.5))):0,d[1]];
  });
  const sw=dims.reduce((n,d)=>n+d[2],0)||1;
  const total=dims.length?Math.round(dims.reduce((n,d)=>n+d[1]*d[2],0)/sw):0;
  const rank=dims.filter(d=>d[1]>0).sort((a,b)=>b[1]-a[1]);
  const texts=ev.map(e=>e.txt).join(' ');
  const mats=M.map(m=>{const base=m[0].replace(/\.[A-Za-z0-9]+$/,'');return {name:m[0],type:m[1],n:Math.min(3,overlap(texts,base))};});

    stages:f.length,reached:Math.min(f.length,(PRAC.done?f.length:PRAC.stage+1)),mats:mats,radar:radarOf(s),
    beat:Math.max(3,Math.min(99,Math.round((total-40)*1.9)))};
  R.review=reviewOf(R,ev,s);

}
function whyWeak(e){

  if(e.d['促成邀约']<6)return '缺少明确的下一步，客户只能自己往下想。';
  if(e.d['价值传递']<6)return '没有给出可核对的量化依据，说服力不足。';
  if(e.d['需求挖掘']<6)return '全程在讲，没有反问确认客户真实需求。';
  return '表达偏长、重点不突出，可压缩成「一句结论 + 一个依据」。';

function tipOf(R,s){

function reviewOf(R,ev,s){
  const out=[];
  if(!ev.length)return [['tip','本场没有记录到有效回应，建议完整走完一次对话后再看复盘。']];
  const sorted=ev.slice().sort((a,b)=>b.sc-a.sc);
  const best=sorted[0],worst=sorted[sorted.length-1];
  out.push(['good','「'+shortTxt(best.txt)+'」· '+best.sc+' 分 —— 命中「'+(best.stage||'当前阶段')+'」的评价要点'+(best.kb?'，并引用知识库《'+best.kb.src+'》':'')+'，是全场最有效的一次回应。']);

   const kind=t.type==='对话考试'?'dk':'script';
   const list=t.scripts||[];
   const done=list.filter(n=>taskItemDone(kind,n,t)).length;
   if(list.length)t.prog=Math.round(done/list.length*100);

   if(d.ex!=null){ if(d.ex>=tPassOf(t,null)){t.prog=100;t.status='done';} else t.status='ing'; }

 }else if(t.type==='培训任务'){
   const on=t.steps||[];
   const dn=on.filter(s=>s.tasks.every(n=>{const q=taskByName(n);return q&&q.prog>=100;})).length;
   if(on.length)t.prog=Math.round(dn/on.length*100);

function drawRadar(elId,size,dims){
  const el=document.getElementById(elId);if(!el)return;
  const src=(dims&&dims.length)?dims:dim6;
  const n=src.length,cx=size/2,cy=size/2,R=size*0.30;
  const names=src.map(d=>d[0]),vals=src.map(d=>d[1]),avg=names.map(()=>70);
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let h='';
  [.25,.5,.75,1].forEach(k=>h+='<polygon points="'+names.map((_,i)=>pt(i,R*k).join(',')).join(' ')+'" fill="'+(k===1?'#FAFCFF':'none')+'" stroke="#E5E9F2"/>');
  names.forEach((d,i)=>{const[x,y]=pt(i,R);h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#E5E9F2"/>';
   const[lx,ly]=pt(i,R+13);const an=lx>cx+4?'start':(lx<cx-4?'end':'middle');
   h+='<text x="'+lx+'" y="'+(ly+3.5)+'" font-size="10" fill="#5B6478" text-anchor="'+an+'" font-family="-apple-system,PingFang SC,sans-serif">'+(d.length>4?d.slice(0,4):d)+'</text>';});
  h+='<polygon points="'+avg.map((v,i)=>pt(i,R*v/100).join(',')).join(' ')+'" fill="none" stroke="#C4D6FF" stroke-width="1.5" stroke-dasharray="4 3"/>';
  h+='<polygon points="'+vals.map((v,i)=>pt(i,R*v/100).join(',')).join(' ')+'" fill="rgba(27,91,240,.15)" stroke="#1B5BF0" stroke-width="2"/>';
  el.innerHTML='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block;margin:0 auto">'+h+'</svg>';
}

  const ph=$('phone'), pw=$('pwd'), ag=$('agree');
  if(ph) ph.value=''; if(pw) pw.value=''; if(ag) ag.checked=false;
  clearErr('loginErr');
}
function showErr(box, tx){ $(box+'Tx').textContent = tx; $(box).classList.add('on'); }
function clearErr(box){ $(box).classList.remove('on'); }
function toggleEye(){ const i=$('pwd'); i.type = i.type==='password'?'text':'password'; }
function validPwd(p){ return p.length>=8 && /[A-Za-z]/.test(p) && /\d/.test(p); }

/* 步骤1：登录 */
function doLogin(){
  clearErr('loginErr');
  if(!$('agree').checked){ showErr('loginErr','请先阅读并同意《用户协议》和《隐私政策》'); return; }
  const phone=$('phone').value.trim();
  const pwd=$('pwd').value;
  if(!/^1\d{10}$/.test(phone)){ showErr('loginErr','请输入正确的 11 位手机号'); return; }
  if(!pwd){ showErr('loginErr','请输入登录密码'); return; }
  const acct=ACCOUNTS[phone];
  if(!acct){ showErr('loginErr','该手机号尚未开通账号，请联系企业管理员在后台开通'); return; }
  if(acct.locked){ showErr('loginErr','该账号已被全局锁定，所有租户均无法登录，请联系管理员'); return; }
  if(acct.pwd!==pwd){
    attempts[phone]=(attempts[phone]||0)+1;
    const left=ATTEMPT_LIMIT-attempts[phone];
    if(left<=0){ showErr('loginErr','密码连续错误次数过多，账号已临时锁定，请稍后或联系管理员'); return; }
    showErr('loginErr','密码错误，还可尝试 '+left+' 次（达到 '+ATTEMPT_LIMIT+' 次将临时锁定）'); return;
  }
  curAcct={phone,acct};
  attempts[phone]=0;
  afterAuth();
}
/* 一键登录（仅原型演示用）：勾选协议 + 填入演示账号并直接登录 */
function demoLogin(phone,pwd){
  const ag=$('agree'); if(ag) ag.checked=true;
  $('phone').value=phone; $('pwd').value=pwd;
  clearErr('loginErr');
  doLogin();
}
function afterAuth(){
  const avail=curAcct.acct.tenants.filter(t=>t.member==='启用');
  if(curAcct.acct.firstLogin){ goStep('setpwd'); return; }
  if(avail.length>1){ renderTenants(avail); goStep('tenant'); return; }
  finish(avail[0]||null);
}
function renderTenants(avail){
  let h='';
  curAcct.acct.tenants.forEach((t,i)=>{
    const ok=t.member==='启用';
    h+='<div class="tenant'+(ok?'':' disabled')+'" '+(ok?'onclick="pickTenant('+i+')"':'')+'>'+
      '<div class="av">'+t.name.charAt(0)+'</div>'+
      '<div class="tt"><b>'+t.name+'</b><span>'+t.sub+' · '+t.role+'</span></div>'+
      (ok?'<div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 6l6 6-6 6"/></svg></div>'
         :'<span style="font-size:11px;color:#E0453F;background:#FDECEB;padding:2px 8px;border-radius:99px">成员已停用</span>')+
      '</div>';
  });
  $('tenantList').innerHTML=h;
}
function pickTenant(i){ const t=curAcct.acct.tenants[i]; if(t.member!=='启用') return; finish(t); }
function doSetPwd(){
  clearErr('setErr');
  const np=$('np1').value, cp=$('np2').value;
  if(!validPwd(np)){ showErr('setErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np!==cp){ showErr('setErr','两次输入的密码不一致'); return; }
  curAcct.acct.pwd=np; curAcct.acct.firstLogin=false;
  toast('密码设置成功'); afterAuth();
}
function finish(tenant){
  curTenant=tenant;
  enter();
}
function enter(){ STACK=['home']; render(); }

/* 忘记密码（底部弹层） */
let codeTimer=null, codeSent=false;
function openForgot(){ $('forgotMask').classList.add('on'); clearErr('fgErr'); }
function closeForgot(){ $('forgotMask').classList.remove('on'); }
function sendCode(){
  const phone=$('fgPhone').value.trim();
  if(!/^1\d{10}$/.test(phone)){ showErr('fgErr','请输入正确的 11 位手机号'); return; }
  if(!ACCOUNTS[phone]){ showErr('fgErr','该手机号尚未开通账号，无法发送验证码'); return; }
  if(ACCOUNTS[phone].locked){ showErr('fgErr','该账号已被全局锁定，请联系管理员重置'); return; }
  codeSent=true;
  let s=60; const b=$('codeBtn'); b.disabled=true; b.textContent=s+'s 后重发';
  codeTimer=setTimeout(function tick(){ s--; if(s<=0){ b.disabled=false; b.textContent='重新获取'; clearTimeout(codeTimer);} else { b.textContent=s+'s 后重发'; codeTimer=setTimeout(tick,1000);} },1000);
  toast('验证码已发送（演示：任意 6 位）');
}
function doReset(){
  clearErr('fgErr');
  const phone=$('fgPhone').value.trim();
  const code=$('fgCode').value.trim();
  const np=$('fgPwd').value, cp=$('fgPwd2').value;
  if(!ACCOUNTS[phone]){ showErr('fgErr','该手机号尚未开通账号'); return; }
  if(!codeSent){ showErr('fgErr','请先获取短信验证码'); return; }
  if(!/^\d{6}$/.test(code)){ showErr('fgErr','请输入 6 位短信验证码'); return; }
  if(!validPwd(np)){ showErr('fgErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np!==cp){ showErr('fgErr','两次输入的密码不一致'); return; }
  ACCOUNTS[phone].pwd=np; ACCOUNTS[phone].firstLogin=false;
  closeForgot(); toast('密码重置成功，请使用新密码登录');
}

/* 修改密码（账号设置 · 底部弹层） */
function openChPwd(){
  $('chpwdMask').classList.add('on');
  $('chOld').value=''; $('chPwd').value=''; $('chPwd2').value='';
  clearErr('chErr');
}
function closeChPwd(){ $('chpwdMask').classList.remove('on'); }
function doChPwd(){
  clearErr('chErr');
  if(!curAcct||!curAcct.acct){ showErr('chErr','当前会话已失效，请重新登录'); return; }
  const old=$('chOld').value, np=$('chPwd').value, cp=$('chPwd2').value;
  if(!old){ showErr('chErr','请输入原密码'); return; }
  if(old!==curAcct.acct.pwd){ showErr('chErr','原密码输入错误，请重新输入'); return; }
  if(!validPwd(np)){ showErr('chErr','新密码需 8 位以上，且同时包含字母与数字'); return; }
  if(np===old){ showErr('chErr','新密码不能与原密码相同'); return; }
  if(np!==cp){ showErr('chErr','两次输入的密码不一致'); return; }
  curAcct.acct.pwd=np; curAcct.acct.firstLogin=false;
  closeChPwd(); toast('密码修改成功，请使用新密码登录');
}

$('pwd').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

/* 实时模拟训练入口：?sim=1&script=剧本名 —— 免登录直达剧本详情页，仅保留陪练路径 */
(function(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('sim')!=='1')return;
    SIM_MODE=true;
    const nm=q.get('script')||'';
    const idx=SCRIPTS.findIndex(s=>s.name===nm);
    SCRIPT=idx>=0?idx:0;
    const phone=Object.keys(ACCOUNTS)[0];
    curAcct={phone,acct:ACCOUNTS[phone]};
    curTenant=curAcct.acct.tenants[0];
    STACK=['scriptDetail'];
    render();
    setTimeout(()=>toast('实时模拟训练模式：仅可体验 剧本详情 → 对练页面 → 陪练报告'),600);
  }catch(err){ console.error('sim boot error',err); }
})();
</script>
